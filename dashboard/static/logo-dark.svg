<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 40" fill="none" height="40">
  <defs>
    <linearGradient id="darkPulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#F43F5E" />
      <stop offset="75%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="darkBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Container -->
  <g transform="translate(2, 2)">
    <rect x="0" y="0" width="36" height="36" rx="9" fill="url(#darkBgGrad)" stroke="#334155" stroke-width="1.2" />
    
    <!-- Railway track cross ties (Schwellen) -->
    <line x1="7" y1="12" x2="7" y2="24" stroke="#475569" stroke-width="1.5" stroke-linecap="round" />
    <line x1="14" y1="12" x2="14" y2="24" stroke="#475569" stroke-width="1.5" stroke-linecap="round" />
    <line x1="29" y1="12" x2="29" y2="24" stroke="#475569" stroke-width="1.5" stroke-linecap="round" />

    <!-- Upper & Lower Rail lines -->
    <path d="M5 14H31" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
    <path d="M5 22H31" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />

    <!-- Dynamic Railway EKG Pulse Line -->
    <path d="M5 18 H12 L15 10 L19 27 L23 13 L26 18 H31" 
          stroke="url(#darkPulseGrad)" 
          stroke-width="2.2" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glow)" />
          
    <!-- Pulse Peak Signal Node -->
    <circle cx="19" cy="27" r="1.8" fill="#F43F5E" />
    <circle cx="15" cy="10" r="1.8" fill="#38BDF8" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(48, 26)">
    <text x="0" y="0" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="21" 
          font-weight="800" 
          letter-spacing="0.5px" 
          fill="#F8FAFC">BAHN</text>
    <text x="64" y="0" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="21" 
          font-weight="300" 
          letter-spacing="1.5px" 
          fill="#38BDF8">PULS</text>
    <!-- Status Indicator Dot -->
    <circle cx="132" cy="-6" r="3" fill="#34D399" />
    <circle cx="132" cy="-6" r="5" fill="#34D399" opacity="0.25" />
  </g>
</svg>
