appearance:
  default: system
  switcher: true

theme:
  colorPalettes:
    default:
      light:
        - "#236aa4"
        - "#45a1bf"
        - "#a5cdee"
        - "#8dacbf"
        - "#85c7c6"
        - "#d2c6ac"
        - "#f4b548"
        - "#8f3d56"
        - "#71b9f4"
        - "#46a485"
      dark:
        - "#236aa4"
        - "#45a1bf"
        - "#a5cdee"
        - "#8dacbf"
        - "#85c7c6"
        - "#d2c6ac"
        - "#f4b548"
        - "#8f3d56"
        - "#71b9f4"
        - "#46a485"
  colorScales:
    default:
      light:
        - "#ADD8E6"
        - "#00008B"
      dark:
        - "#ADD8E6"
        - "#00008B"
    # Einseitig und bei 0 verankert: fuer Anteile von 0 bis 100 %, wo ein hoher Wert den
    # unguenstigen Fall beschreibt. Eine divergierende Skala gehoert hier nicht hin --
    # ein Anteil kann nicht negativ werden.
    verlust:
      light:
        - "#ffffff"
        - "#8f3d56"
      dark:
        - "#09090b"
        - "#d98aa0"
    aufholung:
      light:
        - "#ffffff"
        - "#46a485"
      dark:
        - "#09090b"
        - "#46a485"
  colors:
    primary:
      light: "#2563eb"
      dark: "#3b82f6"
    accent:
      light: "#c2410c"
      dark: "#fdba74"
    base:
      light: "#ffffff"
      dark: "#09090b"
    info:
      light: "#0284c7"
      dark: "#38bdf8"
    positive:
      light: "#16a34a"
      dark: "#4ade80"
    warning:
      light: "#f8c900"
      dark: "#fbbf24"
    negative:
      light: "#dc2626"
      dark: "#f87171"
    # Zeitbilanz: eine Farbe fuer verlorene, eine fuer aufgeholte Zeit -- die
    # Unterscheidung, um die es auf diesen Seiten geht. Die hellen Toene sind
    # Balkenfuellungen und stehen hinter Text, der lesbar bleiben muss; die
    # "-stark"-Toene tragen Linien und Beschriftungen. Evidence legt jede Themenfarbe
    # zusaetzlich als CSS-Variable an (--verloren, --aufgeholt-stark, ...) -- daraus
    # nimmt die Skizze auf der Startseite ihre Farben, statt sie zu wiederholen.
    verloren:
      light: "#e7c3cd"
      dark: "#5d2a3b"
    verloren-stark:
      light: "#8f3d56"
      dark: "#d98aa0"
    aufgeholt:
      light: "#c5dfeb"
      dark: "#1d4757"
    aufgeholt-stark:
      light: "#236aa4"
      dark: "#7cc3e0"

plugins:
  components:
    # This loads all of evidence's core charts and UI components
    # You probably don't want to edit this dependency unless you know what you are doing
    "@evidence-dev/core-components": {}

  datasources:
    # Nur DuckDB: die Marts liegen in einer lokalen DuckDB-Datei, weitere Konnektoren
    # waeren Vorrat ohne Zweck (CLAUDE.md, YAGNI).
    "@evidence-dev/duckdb": {}
