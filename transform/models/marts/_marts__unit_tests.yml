unit_tests:

  # Dieser Fall kommt in echten Daten an zwei Nächten im Jahr vor und lässt sich
  # nicht auf Zuruf herstellen — genau deshalb ein Unit-Test und kein Data-Test:
  # ein Halt in der Umstellungsstunde entwertet nicht nur sich selbst, sondern auch
  # den Laufzeitanteil des Folgehalts, der gegen seine Abfahrtsverspätung rechnet.
  # Ohne diese Prüfung sieht die Folgezeile sauber aus und trägt trotzdem einen um
  # bis zu 3.600 s verschobenen Wert.
  - name: mart_zuglauf_entwertet_umstellungshalt_und_folgehalt
    model: mart_zuglauf
    overrides:
      macros:
        # Ohne diesen Override würde der Unit-Test den inkrementellen Zweig
        # kompilieren und gegen die reale Tabelle statt gegen die Fixture laufen.
        is_incremental: false
    given:
      - input: ref('int_segment_delta')
        rows:
          # Rücksprungnacht: die lokale Stunde 02:00–02:59 existiert zweimal.
          - {betriebstag: "2026-10-25", trip_key: "t1", quelle: "de_gtfsrt", nach_stop_sequence: 1,
             abschnitt_direkt: null, soll_an: null, soll_ab: "2026-10-25 01:30:00",
             delay_an_sek: null, delay_ab_sek: 60, laufzeit_delta_sek: null, haltezeit_delta_sek: null,
             halt_ausgelassen: false, zug_ausgefallen: false, ist_endgueltig: true}
          - {betriebstag: "2026-10-25", trip_key: "t1", quelle: "de_gtfsrt", nach_stop_sequence: 2,
             abschnitt_direkt: true, soll_an: "2026-10-25 02:10:00", soll_ab: "2026-10-25 02:15:00",
             delay_an_sek: 300, delay_ab_sek: 240, laufzeit_delta_sek: 240, haltezeit_delta_sek: -60,
             halt_ausgelassen: false, zug_ausgefallen: false, ist_endgueltig: true}
          - {betriebstag: "2026-10-25", trip_key: "t1", quelle: "de_gtfsrt", nach_stop_sequence: 3,
             abschnitt_direkt: true, soll_an: "2026-10-25 03:00:00", soll_ab: "2026-10-25 03:05:00",
             delay_an_sek: 120, delay_ab_sek: 100, laufzeit_delta_sek: -120, haltezeit_delta_sek: -20,
             halt_ausgelassen: false, zug_ausgefallen: false, ist_endgueltig: true}
          # Frühjahr: die lokale Stunde 02:00–02:59 existiert gar nicht. Gleiche
          # Behandlung, andere Ursache.
          - {betriebstag: "2026-03-29", trip_key: "t2", quelle: "de_gtfsrt", nach_stop_sequence: 1,
             abschnitt_direkt: null, soll_an: null, soll_ab: "2026-03-29 02:40:00",
             delay_an_sek: null, delay_ab_sek: 90, laufzeit_delta_sek: null, haltezeit_delta_sek: null,
             halt_ausgelassen: false, zug_ausgefallen: false, ist_endgueltig: true}
          # Kontrolle: derselbe Betriebstag, aber außerhalb der Umstellungsstunde —
          # hier darf nichts entwertet werden.
          - {betriebstag: "2026-03-29", trip_key: "t2", quelle: "de_gtfsrt", nach_stop_sequence: 2,
             abschnitt_direkt: true, soll_an: "2026-03-29 04:10:00", soll_ab: "2026-03-29 04:12:00",
             delay_an_sek: 150, delay_ab_sek: 140, laufzeit_delta_sek: 60, haltezeit_delta_sek: -10,
             halt_ausgelassen: false, zug_ausgefallen: false, ist_endgueltig: true}
      # Leer, nicht weggelassen: mart_zuglauf hängt seit BPULS-079 an dieser Tabelle,
      # und dbt verlangt für jeden ref des geprüften Modells eine Eingabe. Leer heißt
      # hier "keine Lücke bekannt" — der Normalfall, gegen den dieser Test rechnet.
      - input: ref('int_erhebungsluecke')
        rows: []
    expect:
      rows:
        - {trip_key: "t1", halt_nr: 1, delay_ab_sek: 60, laufzeit_delta_sek: null,
           haltezeit_delta_sek: null, zeitumstellung_mehrdeutig: false}
        - {trip_key: "t1", halt_nr: 2, delay_ab_sek: null, laufzeit_delta_sek: null,
           haltezeit_delta_sek: null, zeitumstellung_mehrdeutig: true}
        # Der springende Punkt: eigene Werte bleiben, der Laufzeitanteil nicht.
        - {trip_key: "t1", halt_nr: 3, delay_ab_sek: 100, laufzeit_delta_sek: null,
           haltezeit_delta_sek: -20, zeitumstellung_mehrdeutig: false}
        - {trip_key: "t2", halt_nr: 1, delay_ab_sek: null, laufzeit_delta_sek: null,
           haltezeit_delta_sek: null, zeitumstellung_mehrdeutig: true}
        - {trip_key: "t2", halt_nr: 2, delay_ab_sek: 140, laufzeit_delta_sek: null,
           haltezeit_delta_sek: -10, zeitumstellung_mehrdeutig: false}

  # Ein Ausfall darf die Kennzahl nicht rechnerisch verbessern (CLAUDE.md Regel 8).
  # Die Prüfung gehört auf die Aggregatsicht, weil dort der Nenner entsteht: der
  # ausgefallene Zug zählt bei `zuege` mit, bei `laufzeit_messwerte` nicht.
  - name: mart_verspaetungsentstehung_ausfall_nicht_im_nenner
    model: mart_verspaetungsentstehung
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('mart_zuglauf')
        rows:
          - {betriebstag: "2026-08-11", quelle: "de_gtfsrt", trip_key: "a", halt_nr: 2,
             abschnitt_direkt: true, abschnitt_im_gebiet: true, von_stop_id: "A", von_stop_name: "A", stop_id: "B", stop_name: "B",
             laufzeit_delta_sek: 300, haltezeit_delta_sek: 60,
             zug_ausgefallen: false, halt_ausgelassen: false, zeitumstellung_mehrdeutig: false, erhebung_vollstaendig: true}
          - {betriebstag: "2026-08-11", quelle: "de_gtfsrt", trip_key: "b", halt_nr: 2,
             abschnitt_direkt: true, abschnitt_im_gebiet: true, von_stop_id: "A", von_stop_name: "A", stop_id: "B", stop_name: "B",
             laufzeit_delta_sek: null, haltezeit_delta_sek: null,
             zug_ausgefallen: true, halt_ausgelassen: false, zeitumstellung_mehrdeutig: false, erhebung_vollstaendig: true}
    expect:
      rows:
        # 300/1, nicht 300/2 — der ausgefallene Zug ist sichtbar (zuege,
        # ausgefallene_halte), aber nicht Teil des Durchschnitts.
        - {betriebstag: "2026-08-11", von_stop_id: "A", nach_stop_id: "B", zuege: 2,
           laufzeit_delta_sek_summe: 300, laufzeit_messwerte: 1, laufzeit_delta_sek_je_zug: 300.0,
           ausgefallene_halte: 1, ausgelassene_halte: 0, halte_zeitumstellung: 0}

  # Die sechs Zustände eines Halts lassen sich in echten Daten nicht auf Zuruf
  # nebeneinander herstellen — ein ausgelassener Halt mitten im Lauf, ein verkürzter
  # Laufweg, ein Ausfall, die Umstellungsstunde und eine fehlende Meldung gleichzeitig
  # kommen in keiner Fixture zusammen vor. Genau dafür ein Unit-Test.
  #
  # Der Fall, auf den es ankommt, ist der Unterschied zwischen **ausgelassen** und
  # **verkürzt**: beide sind `halt_ausgelassen`, aber ein übersprungener Halt mitten
  # im Lauf ist ein anderer Vorgang als ein Laufweg, der vorne oder hinten gekappt
  # wurde. Eine Verwechslung fiele nirgends auf — die Summe stimmt in beiden Fällen.
  - name: mart_puenktlichkeit_trennt_die_sieben_zustaende
    model: mart_puenktlichkeit
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('mart_zuglauf')
        rows:
          # Fahrt A deckt vier der sechs Zustände ab. Die Halte am Rand und in der
          # Mitte sind **absichtlich ungleich verteilt** (zwei gekappte, ein
          # ausgelassener): bei gleicher Zahl bliebe eine Verwechslung der beiden
          # Bedingungen unbemerkt, weil sich dann nur die Etiketten tauschen und die
          # Summen gleich bleiben. Gegengeprüft — mit vertauschter Bedingung schlägt
          # dieser Test fehl.
          - {betriebstag: '2026-08-13', quelle: 'de_gtfsrt', route_kurzname: 'RE 1', trip_key: 'a', halt_nr: 1, delay_an_sek: null, halt_ausgelassen: true,  zug_ausgefallen: false, zeitumstellung_mehrdeutig: false, halt_im_gebiet: true, erhebung_vollstaendig: true}
          - {betriebstag: '2026-08-13', quelle: 'de_gtfsrt', route_kurzname: 'RE 1', trip_key: 'a', halt_nr: 2, delay_an_sek: null, halt_ausgelassen: true,  zug_ausgefallen: false, zeitumstellung_mehrdeutig: false, halt_im_gebiet: true, erhebung_vollstaendig: true}
          - {betriebstag: '2026-08-13', quelle: 'de_gtfsrt', route_kurzname: 'RE 1', trip_key: 'a', halt_nr: 3, delay_an_sek: 100,  halt_ausgelassen: false, zug_ausgefallen: false, zeitumstellung_mehrdeutig: false, halt_im_gebiet: true, erhebung_vollstaendig: true}
          - {betriebstag: '2026-08-13', quelle: 'de_gtfsrt', route_kurzname: 'RE 1', trip_key: 'a', halt_nr: 4, delay_an_sek: null, halt_ausgelassen: true,  zug_ausgefallen: false, zeitumstellung_mehrdeutig: false, halt_im_gebiet: true, erhebung_vollstaendig: true}
          - {betriebstag: '2026-08-13', quelle: 'de_gtfsrt', route_kurzname: 'RE 1', trip_key: 'a', halt_nr: 5, delay_an_sek: 400,  halt_ausgelassen: false, zug_ausgefallen: false, zeitumstellung_mehrdeutig: false, halt_im_gebiet: true, erhebung_vollstaendig: true}
          - {betriebstag: '2026-08-13', quelle: 'de_gtfsrt', route_kurzname: 'RE 1', trip_key: 'a', halt_nr: 6, delay_an_sek: null, halt_ausgelassen: false, zug_ausgefallen: false, zeitumstellung_mehrdeutig: false, halt_im_gebiet: true, erhebung_vollstaendig: true}
          - {betriebstag: '2026-08-13', quelle: 'de_gtfsrt', route_kurzname: 'RE 1', trip_key: 'a', halt_nr: 7, delay_an_sek: null, halt_ausgelassen: true,  zug_ausgefallen: false, zeitumstellung_mehrdeutig: false, halt_im_gebiet: true, erhebung_vollstaendig: true}
          # Fahrt B: vollständig ausgefallen.
          - {betriebstag: '2026-08-13', quelle: 'de_gtfsrt', route_kurzname: 'RE 1', trip_key: 'b', halt_nr: 1, delay_an_sek: null, halt_ausgelassen: false, zug_ausgefallen: true,  zeitumstellung_mehrdeutig: false, halt_im_gebiet: true, erhebung_vollstaendig: true}
          - {betriebstag: '2026-08-13', quelle: 'de_gtfsrt', route_kurzname: 'RE 1', trip_key: 'b', halt_nr: 2, delay_an_sek: null, halt_ausgelassen: false, zug_ausgefallen: true,  zeitumstellung_mehrdeutig: false, halt_im_gebiet: true, erhebung_vollstaendig: true}
          # Fahrt C: ein Halt in der Umstellungsstunde — nicht bestimmbar, nicht unpünktlich.
          - {betriebstag: '2026-08-13', quelle: 'de_gtfsrt', route_kurzname: 'RE 1', trip_key: 'c', halt_nr: 1, delay_an_sek: null, halt_ausgelassen: false, zug_ausgefallen: false, zeitumstellung_mehrdeutig: false, halt_im_gebiet: true, erhebung_vollstaendig: true}
          - {betriebstag: '2026-08-13', quelle: 'de_gtfsrt', route_kurzname: 'RE 1', trip_key: 'c', halt_nr: 2, delay_an_sek: null, halt_ausgelassen: false, zug_ausgefallen: false, zeitumstellung_mehrdeutig: true, halt_im_gebiet: true, erhebung_vollstaendig: true}
          # Fahrt D: **kein einziger Halt bedient** — die Form, in der ein
          # vollständiger Ausfall in diesem Feed ankommt (BPULS-064). Bewusst vier
          # Halte, damit die Zahl (3 zählende) sich von 'verkuerzt' (2) und
          # 'ausgelassen' (1) unterscheidet: bei gleicher Zahl bliebe eine
          # Verwechslung der Bedingungen unbemerkt. Gegengeprüft — ohne den eigenen
          # Zweig fallen diese drei nach 'ausgelassen' und der Test schlägt fehl.
          - {betriebstag: '2026-08-13', quelle: 'de_gtfsrt', route_kurzname: 'RE 1', trip_key: 'd', halt_nr: 1, delay_an_sek: null, halt_ausgelassen: true,  zug_ausgefallen: false, zeitumstellung_mehrdeutig: false, halt_im_gebiet: true, erhebung_vollstaendig: true}
          - {betriebstag: '2026-08-13', quelle: 'de_gtfsrt', route_kurzname: 'RE 1', trip_key: 'd', halt_nr: 2, delay_an_sek: null, halt_ausgelassen: true,  zug_ausgefallen: false, zeitumstellung_mehrdeutig: false, halt_im_gebiet: true, erhebung_vollstaendig: true}
          - {betriebstag: '2026-08-13', quelle: 'de_gtfsrt', route_kurzname: 'RE 1', trip_key: 'd', halt_nr: 3, delay_an_sek: null, halt_ausgelassen: true,  zug_ausgefallen: false, zeitumstellung_mehrdeutig: false, halt_im_gebiet: true, erhebung_vollstaendig: true}
          - {betriebstag: '2026-08-13', quelle: 'de_gtfsrt', route_kurzname: 'RE 1', trip_key: 'd', halt_nr: 4, delay_an_sek: null, halt_ausgelassen: true,  zug_ausgefallen: false, zeitumstellung_mehrdeutig: false, halt_im_gebiet: true, erhebung_vollstaendig: true}
          # Fahrt E: ebenfalls **kein** bedienter Halt — und **nicht prüfbar**, weil
          # ihre trip_id in keiner gültigen Fahrplan-Version steht (BPULS-066). Der
          # Unterschied zu F ist der ganze Punkt: E ist nicht widerlegt, sondern
          # ungeprüft.
          - {betriebstag: '2026-08-13', quelle: 'de_gtfsrt', route_kurzname: 'RE 1', trip_key: 'e', halt_nr: 1, delay_an_sek: null, halt_ausgelassen: true,  zug_ausgefallen: false, zeitumstellung_mehrdeutig: false, halt_im_gebiet: true, erhebung_vollstaendig: true}
          - {betriebstag: '2026-08-13', quelle: 'de_gtfsrt', route_kurzname: 'RE 1', trip_key: 'e', halt_nr: 2, delay_an_sek: null, halt_ausgelassen: true,  zug_ausgefallen: false, zeitumstellung_mehrdeutig: false, halt_im_gebiet: true, erhebung_vollstaendig: true}
          - {betriebstag: '2026-08-13', quelle: 'de_gtfsrt', route_kurzname: 'RE 1', trip_key: 'e', halt_nr: 3, delay_an_sek: null, halt_ausgelassen: true,  zug_ausgefallen: false, zeitumstellung_mehrdeutig: false, halt_im_gebiet: true, erhebung_vollstaendig: true}
          # Fahrt F: geprüft und **widerlegt** — der Fahrplan sieht mehr Halte vor, als
          # beobachtet wurden. Sie ist der Fall, für den die Spalte ursprünglich
          # gedacht war, und muss von E unterscheidbar bleiben.
          - {betriebstag: '2026-08-13', quelle: 'de_gtfsrt', route_kurzname: 'RE 1', trip_key: 'f', halt_nr: 1, delay_an_sek: null, halt_ausgelassen: true,  zug_ausgefallen: false, zeitumstellung_mehrdeutig: false, halt_im_gebiet: true, erhebung_vollstaendig: true}
          - {betriebstag: '2026-08-13', quelle: 'de_gtfsrt', route_kurzname: 'RE 1', trip_key: 'f', halt_nr: 2, delay_an_sek: null, halt_ausgelassen: true,  zug_ausgefallen: false, zeitumstellung_mehrdeutig: false, halt_im_gebiet: true, erhebung_vollstaendig: true}
          # Fahrt G: zweite nicht prüfbare Fahrt, damit die drei Zahlen sich
          # unterscheiden (4 unbedient, davon 1 belegt und 2 nicht prüfbar). Bei
          # gleicher Zahl bliebe eine Verwechslung der Spalten unbemerkt — derselbe
          # Grund wie bei D gegen E.
          - {betriebstag: '2026-08-13', quelle: 'de_gtfsrt', route_kurzname: 'RE 1', trip_key: 'g', halt_nr: 1, delay_an_sek: null, halt_ausgelassen: true,  zug_ausgefallen: false, zeitumstellung_mehrdeutig: false, halt_im_gebiet: true, erhebung_vollstaendig: true}
          - {betriebstag: '2026-08-13', quelle: 'de_gtfsrt', route_kurzname: 'RE 1', trip_key: 'g', halt_nr: 2, delay_an_sek: null, halt_ausgelassen: true,  zug_ausgefallen: false, zeitumstellung_mehrdeutig: false, halt_im_gebiet: true, erhebung_vollstaendig: true}
          - {betriebstag: '2026-08-13', quelle: 'de_gtfsrt', route_kurzname: 'RE 1', trip_key: 'g', halt_nr: 3, delay_an_sek: null, halt_ausgelassen: true,  zug_ausgefallen: false, zeitumstellung_mehrdeutig: false, halt_im_gebiet: true, erhebung_vollstaendig: true}
      - input: ref('int_de_soll_laufweg')
        rows:
          # D deckt ihren Soll-Laufweg vollständig ab, F nicht — beide sind geprüft.
          - {betriebstag: '2026-08-13', trip_key: 'd', laufweg_pruefbar: true,  laufweg_vollstaendig: true}
          - {betriebstag: '2026-08-13', trip_key: 'f', laufweg_pruefbar: true,  laufweg_vollstaendig: false}
          # E steht mit einer Zeile da, die sagt, dass nichts zu prüfen war — so
          # liefert das Modell es seit BPULS-066.
          - {betriebstag: '2026-08-13', trip_key: 'e', laufweg_pruefbar: false, laufweg_vollstaendig: null}
          # G fehlt ganz. Das darf nachgelagert nichts anderes bedeuten als bei E; der
          # left join muss daraus "nicht prüfbar" machen und nicht NULL weiterreichen.
    expect:
      # Der erste Halt jeder Fahrt zählt nie mit — dort kommt planmäßig nichts an.
      # Von dreiundzwanzig Zeilen bleiben sechzehn: 2 verkürzt (Halt 2 vorne, Halt 7
      # hinten), 1 ausgelassen (Halt 4, mitten im Lauf), 2 gemessen, 1 ohne Meldung,
      # 1 ausgefallen, 1 mehrdeutig, 8 aus den unbedienten Läufen D (3), E (2), F (1)
      # und G (2).
      rows:
        - {schwelle_sek: 60, halte_mit_ankunft: 16, halte_ausgefallen: 1, halte_unbedienter_lauf: 8, halte_verkuerzt: 2, halte_ausgelassen: 1, halte_mehrdeutig: 1, halte_ohne_meldung: 1, halte_gemessen: 2, halte_puenktlich: 0, fahrten: 7, fahrten_ausgefallen: 1, fahrten_unbedienter_lauf: 4, fahrten_unbedienter_lauf_bestaetigt: 1, fahrten_unbedienter_lauf_nicht_pruefbar: 2, fahrten_verkuerzt: 1}
        - {schwelle_sek: 180, halte_mit_ankunft: 16, halte_ausgefallen: 1, halte_unbedienter_lauf: 8, halte_verkuerzt: 2, halte_ausgelassen: 1, halte_mehrdeutig: 1, halte_ohne_meldung: 1, halte_gemessen: 2, halte_puenktlich: 1, fahrten: 7, fahrten_ausgefallen: 1, fahrten_unbedienter_lauf: 4, fahrten_unbedienter_lauf_bestaetigt: 1, fahrten_unbedienter_lauf_nicht_pruefbar: 2, fahrten_verkuerzt: 1}
        - {schwelle_sek: 360, halte_mit_ankunft: 16, halte_ausgefallen: 1, halte_unbedienter_lauf: 8, halte_verkuerzt: 2, halte_ausgelassen: 1, halte_mehrdeutig: 1, halte_ohne_meldung: 1, halte_gemessen: 2, halte_puenktlich: 1, fahrten: 7, fahrten_ausgefallen: 1, fahrten_unbedienter_lauf: 4, fahrten_unbedienter_lauf_bestaetigt: 1, fahrten_unbedienter_lauf_nicht_pruefbar: 2, fahrten_verkuerzt: 1}
        - {schwelle_sek: 900, halte_mit_ankunft: 16, halte_ausgefallen: 1, halte_unbedienter_lauf: 8, halte_verkuerzt: 2, halte_ausgelassen: 1, halte_mehrdeutig: 1, halte_ohne_meldung: 1, halte_gemessen: 2, halte_puenktlich: 2, fahrten: 7, fahrten_ausgefallen: 1, fahrten_unbedienter_lauf: 4, fahrten_unbedienter_lauf_bestaetigt: 1, fahrten_unbedienter_lauf_nicht_pruefbar: 2, fahrten_verkuerzt: 1}
        - {schwelle_sek: 3600, halte_mit_ankunft: 16, halte_ausgefallen: 1, halte_unbedienter_lauf: 8, halte_verkuerzt: 2, halte_ausgelassen: 1, halte_mehrdeutig: 1, halte_ohne_meldung: 1, halte_gemessen: 2, halte_puenktlich: 2, fahrten: 7, fahrten_ausgefallen: 1, fahrten_unbedienter_lauf: 4, fahrten_unbedienter_lauf_bestaetigt: 1, fahrten_unbedienter_lauf_nicht_pruefbar: 2, fahrten_verkuerzt: 1}

  # BPULS-075: der Collector sammelt Fernverkehrsfahrten mit ihrem **ganzen** Laufweg.
  # `Köln Hbf -> Köln Messe/Deutz` stand deshalb mit 261 Zügen in der Engpass-Rangliste,
  # obwohl Köln in keiner Halteliste vorkommt. In echten Daten fällt so etwas nur
  # jemandem mit Streckenkenntnis auf — die Zeile sieht vollkommen plausibel aus.
  #
  # Beide Abschnitte hier tragen denselben Laufzeitverlust. Ginge der fremde mit ein,
  # bliebe die Zeilenzahl gleich und nur der Durchschnitt wanderte — genau die Form von
  # Fehler, die kein Test bemerkt, der bloß zählt.
  - name: mart_verspaetungsentstehung_rechnet_nur_im_gebiet
    model: mart_verspaetungsentstehung
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('mart_zuglauf')
        rows:
          # Einfahrt ins Gebiet: gefahren, aber nicht hier entstanden.
          - {betriebstag: "2026-08-23", quelle: "de_gtfsrt", trip_key: "ice", halt_nr: 2,
             abschnitt_direkt: true, abschnitt_im_gebiet: false,
             von_stop_id: "K", von_stop_name: "Köln Hbf", stop_id: "M", stop_name: "Mainz Hbf",
             laufzeit_delta_sek: 300, haltezeit_delta_sek: 60,
             zug_ausgefallen: false, halt_ausgelassen: false, zeitumstellung_mehrdeutig: false, erhebung_vollstaendig: true}
          - {betriebstag: "2026-08-23", quelle: "de_gtfsrt", trip_key: "ice", halt_nr: 3,
             abschnitt_direkt: true, abschnitt_im_gebiet: true,
             von_stop_id: "M", von_stop_name: "Mainz Hbf", stop_id: "F", stop_name: "Frankfurt Hbf",
             laufzeit_delta_sek: 300, haltezeit_delta_sek: 60,
             zug_ausgefallen: false, halt_ausgelassen: false, zeitumstellung_mehrdeutig: false, erhebung_vollstaendig: true}
    expect:
      rows:
        - {betriebstag: "2026-08-23", von_stop_id: "M", nach_stop_id: "F", zuege: 1,
           laufzeit_delta_sek_summe: 300, laufzeit_messwerte: 1, laufzeit_delta_sek_je_zug: 300.0}

  # Die Kehrseite desselben Schnitts: was **nicht** wegfallen darf. Ein Zug, der mit
  # 15 Minuten ins Gebiet einfährt, bringt seine Verspätung mit — sie ist an seinem
  # ersten Gebietshalt zu messen und gehört in die Quote. Würde auf das Gebiet
  # eingeschränkt, **bevor** die Laufwegfenster gerechnet sind, gälte genau dieser Halt
  # als Startbahnhof ohne planmäßige Ankunft und fiele heraus — die Quote sähe damit
  # systematisch besser aus, weil sie die einfahrende Verspätung nicht mehr sieht.
  #
  # Fahrt `nord` liegt vollständig außerhalb (Nummernkollision oder reiner Durchläufer)
  # und darf `fahrten` nicht erhöhen.
  - name: mart_puenktlichkeit_zaehlt_nur_gebietshalte_behaelt_aber_die_einfahrt
    model: mart_puenktlichkeit
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('mart_zuglauf')
        rows:
          - {betriebstag: '2026-08-23', quelle: 'de_gtfsrt', route_kurzname: 'ICE 690', trip_key: 'ice', halt_nr: 1, delay_an_sek: null, halt_ausgelassen: false, zug_ausgefallen: false, zeitumstellung_mehrdeutig: false, halt_im_gebiet: false, erhebung_vollstaendig: true}
          - {betriebstag: '2026-08-23', quelle: 'de_gtfsrt', route_kurzname: 'ICE 690', trip_key: 'ice', halt_nr: 2, delay_an_sek: 900,  halt_ausgelassen: false, zug_ausgefallen: false, zeitumstellung_mehrdeutig: false, halt_im_gebiet: true, erhebung_vollstaendig: true}
          - {betriebstag: '2026-08-23', quelle: 'de_gtfsrt', route_kurzname: 'ICE 690', trip_key: 'ice', halt_nr: 3, delay_an_sek: 0,    halt_ausgelassen: false, zug_ausgefallen: false, zeitumstellung_mehrdeutig: false, halt_im_gebiet: true, erhebung_vollstaendig: true}
          - {betriebstag: '2026-08-23', quelle: 'de_gtfsrt', route_kurzname: 'ICE 690', trip_key: 'nord', halt_nr: 1, delay_an_sek: null, halt_ausgelassen: false, zug_ausgefallen: false, zeitumstellung_mehrdeutig: false, halt_im_gebiet: false, erhebung_vollstaendig: true}
          - {betriebstag: '2026-08-23', quelle: 'de_gtfsrt', route_kurzname: 'ICE 690', trip_key: 'nord', halt_nr: 2, delay_an_sek: 60,   halt_ausgelassen: false, zug_ausgefallen: false, zeitumstellung_mehrdeutig: false, halt_im_gebiet: false, erhebung_vollstaendig: true}
      - input: ref('int_de_soll_laufweg')
        rows: []
    expect:
      # Zwei Halte im Nenner: der Einfahrtshalt mit seinen 900 s und der Halt danach.
      # Der Halt vor der Gebietsgrenze zählt nicht, die zweite Fahrt gar nicht.
      rows:
        - {schwelle_sek: 60,   halte_mit_ankunft: 2, halte_gemessen: 2, halte_puenktlich: 1, fahrten: 1}
        - {schwelle_sek: 180,  halte_mit_ankunft: 2, halte_gemessen: 2, halte_puenktlich: 1, fahrten: 1}
        - {schwelle_sek: 360,  halte_mit_ankunft: 2, halte_gemessen: 2, halte_puenktlich: 1, fahrten: 1}
        - {schwelle_sek: 900,  halte_mit_ankunft: 2, halte_gemessen: 2, halte_puenktlich: 1, fahrten: 1}
        - {schwelle_sek: 3600, halte_mit_ankunft: 2, halte_gemessen: 2, halte_puenktlich: 2, fahrten: 1}

  # BPULS-079, die Kennzeichnungsseite. Der Fall lässt sich an keiner Fixture zeigen:
  # ob ein Betriebstag schief erhoben wurde, steht nicht in den Daten dieses Tages —
  # sie sehen aus wie ein ruhiger Tag. Genau deshalb ein Unit-Test.
  #
  # Geprüft wird beides: die Zeile bleibt stehen (entwerten, nicht löschen), und der
  # Nachbartag bleibt unangetastet — ein Bereich, der über seine Grenzen läuft, fiele
  # sonst nirgends auf.
  - name: mart_zuglauf_kennzeichnet_unvollstaendige_erhebung
    model: mart_zuglauf
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int_segment_delta')
        rows:
          - {betriebstag: "2026-08-22", trip_key: "t1", quelle: "de_gtfsrt", nach_stop_sequence: 2,
             abschnitt_direkt: true, soll_an: "2026-08-22 08:10:00", soll_ab: "2026-08-22 08:12:00",
             delay_an_sek: 120, delay_ab_sek: 100, laufzeit_delta_sek: 60, haltezeit_delta_sek: -20,
             halt_ausgelassen: false, zug_ausgefallen: false, ist_endgueltig: true}
          - {betriebstag: "2026-08-24", trip_key: "t2", quelle: "de_gtfsrt", nach_stop_sequence: 2,
             abschnitt_direkt: true, soll_an: "2026-08-24 08:10:00", soll_ab: "2026-08-24 08:12:00",
             delay_an_sek: 120, delay_ab_sek: 100, laufzeit_delta_sek: 60, haltezeit_delta_sek: -20,
             halt_ausgelassen: false, zug_ausgefallen: false, ist_endgueltig: true}
      - input: ref('int_erhebungsluecke')
        rows:
          - {betriebstag: "2026-08-22", grund: "Gebietsliste veraltet", referenz: "BPULS-073"}
    expect:
      rows:
        # Die Zeile des schief erhobenen Tages bleibt — mit ihren Werten. Entwertet
        # wird der Tag als Ganzes in den Aggregaten, nicht der einzelne Messwert:
        # gemessen wurde richtig, nur eben zu wenig und nicht repräsentativ.
        - {trip_key: "t1", halt_nr: 2, laufzeit_delta_sek: 60, erhebung_vollstaendig: false}
        - {trip_key: "t2", halt_nr: 2, laufzeit_delta_sek: 60, erhebung_vollstaendig: true}

  # Die Ausschlussseite desselben Befunds. Ein Betriebstag mit unvollständiger Erhebung
  # darf in keinem Aggregat auftauchen — auch nicht mit kleinen Zahlen, denn die kleine
  # Zahl ist genau die Täuschung: sie sieht aus wie ein ruhiger Tag.
  - name: mart_verspaetungsentstehung_laesst_unvollstaendige_tage_aus
    model: mart_verspaetungsentstehung
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('mart_zuglauf')
        rows:
          - {betriebstag: "2026-08-22", quelle: "de_gtfsrt", trip_key: "schief", halt_nr: 2,
             abschnitt_direkt: true, abschnitt_im_gebiet: true,
             von_stop_id: "M", von_stop_name: "Mainz Hbf", stop_id: "F", stop_name: "Frankfurt Hbf",
             laufzeit_delta_sek: 900, haltezeit_delta_sek: 60,
             zug_ausgefallen: false, halt_ausgelassen: false, zeitumstellung_mehrdeutig: false,
             erhebung_vollstaendig: false}
          - {betriebstag: "2026-08-24", quelle: "de_gtfsrt", trip_key: "sauber", halt_nr: 2,
             abschnitt_direkt: true, abschnitt_im_gebiet: true,
             von_stop_id: "M", von_stop_name: "Mainz Hbf", stop_id: "F", stop_name: "Frankfurt Hbf",
             laufzeit_delta_sek: 300, haltezeit_delta_sek: 60,
             zug_ausgefallen: false, halt_ausgelassen: false, zeitumstellung_mehrdeutig: false,
             erhebung_vollstaendig: true}
    expect:
      rows:
        - {betriebstag: "2026-08-24", von_stop_id: "M", nach_stop_id: "F", zuege: 1,
           laufzeit_delta_sek_summe: 300, laufzeit_messwerte: 1, laufzeit_delta_sek_je_zug: 300.0}
