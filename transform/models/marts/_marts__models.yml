version: 2

models:
  - name: mart_zuglauf
    description: >
      A1 in der Detailsicht — eine Zeile je Halt-Ereignis einer Fahrt, aus der sich
      der Wasserfall eines Laufwegs lesen lässt. Einzige Quelle des Dashboards für
      Einzelfahrten (CLAUDE.md Regel 11). Alle Verspätungswerte in Sekunden, positiv
      = zu spät. NULL heißt durchgehend "nicht bestimmbar", nie 0 — das betrifft
      Ausfälle, ausgelassene Halte und Halte in der Umstellungsstunde.
    columns:
      - name: betriebstag
        description: Betriebstag, nicht Kalendertag. Partitionsschlüssel des inkrementellen Laufs.
        tests:
          - not_null
      - name: trip_key
        tests:
          - not_null
      - name: halt_nr
        description: Position im Laufweg, ab 1 (entspricht stop_sequence der Faktentabelle).
        tests:
          - not_null
      - name: halt_im_gebiet
        description: >
          Liegt der Halt in VRN + RMV (BPULS-075)? Dieser Mart trägt weiterhin **alle**
          Halte einer Fahrt, auch die außerhalb — ein Fernzug bringt seinen Laufweg mit,
          und der Laufweg soll lückenlos lesbar bleiben. Wer aggregiert, filtert:
          Seiten, die eine Kennzahl über das Gebiet zeigen, prüfen diese Spalte.
        tests:
          - not_null
      - name: von_halt_im_gebiet
        description: Lag der Vorhalt im Gebiet? NULL am ersten Halt einer Fahrt.
      - name: abschnitt_im_gebiet
        description: >
          Beide Endpunkte im Gebiet. Die Bedingung, unter der ein Abschnitt in ein
          Aggregat eingeht (mart_verspaetungsentstehung, mart_engpassknoten,
          mart_pufferbilanz) — zusammen mit `abschnitt_direkt`.
        tests:
          - not_null
      - name: erhebung_vollstaendig
        description: >
          War die Erhebung an diesem Betriebstag vollständig (BPULS-079)? Dieselbe
          Behandlung wie beim Gebiet: der Laufweg bleibt lückenlos lesbar, die
          Aggregate lassen den Tag aus. `false` heißt nicht „wenig Verkehr", sondern
          **schief erhoben** — am 22./23.08.2026 kam durch, was die Rotation der
          Haltestellennummern zufällig überlebt hatte, also überproportional große
          Bahnhöfe und Fernverkehr. Die Liste der Tage steht im Seed
          `erhebungsluecken`, der Grund in `mart_datenqualitaet.erhebung_grund`.
        tests:
          - not_null
      - name: quelle
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['de_gtfsrt']
      - name: delay_an_sek
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -3600
                max_value: 86400
                inclusive: true
      - name: delay_ab_sek
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -3600
                max_value: 86400
                inclusive: true
      - name: laufzeit_delta_sek
        description: >
          Was auf dem Abschnitt vom Vorhalt hierher entstanden ist. Negativ =
          Pufferabbau (A2), kein Fehler. NULL am ersten Halt und überall dort, wo
          eine der beiden Verspätungen nicht bestimmbar ist — auch dann, wenn nur
          der Vorhalt in der Umstellungsstunde liegt.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -86400
                max_value: 86400
                inclusive: true
      - name: haltezeit_delta_sek
        description: Was während des Halts entstanden ist. NULL, wo eine der beiden Zeiten fehlt.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -86400
                max_value: 86400
                inclusive: true
      - name: zeitumstellung_mehrdeutig
        description: >
          Soll-Zeit liegt in der Stunde der Zeitumstellung; die Verspätung kann um
          genau 3.600 s danebenliegen und ist nicht rekonstruierbar (BPULS-013).
          Die Zeile bleibt stehen, damit der Laufweg lückenlos lesbar ist, trägt aber
          keine Kennzahl. Gehört auf die Methodik-Seite und in mart_datenqualitaet.
        tests:
          - not_null
      - name: halt_ausgelassen
        tests:
          - not_null
      - name: zug_ausgefallen
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - trip_key
              - halt_nr

  - name: mart_verspaetungsentstehung
    description: >
      A1 aggregiert — Laufzeit- und Haltezeitanteil je Betriebstag und Abschnitt
      (von → nach). Enthält nur direkte Abschnitte; der Startbahnhof jeder Fahrt hat
      keinen Vorhalt und ist deshalb nicht enthalten. Summe und Zähler stehen
      nebeneinander, damit über mehrere Tage korrekt weiteraggregiert werden kann.
    columns:
      - name: betriebstag
        tests:
          - not_null
      - name: quelle
        tests:
          - not_null
      - name: zuege
        description: Zahl unterschiedlicher Fahrten über diesen Abschnitt an diesem Betriebstag.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
      - name: laufzeit_messwerte
        description: >
          Zahl der Fahrten, für die der Laufzeitanteil bestimmbar war — Nenner der
          je-Zug-Kennzahl. Kleiner als `zuege`, wenn Ausfälle, ausgelassene Halte
          oder Umstellungshalte darunter sind.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: haltezeit_messwerte
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: laufzeit_delta_sek_je_zug
        description: >
          Summe/Zähler, nur für die Ein-Tages-Sicht. Über mehrere Tage nicht mitteln,
          sondern aus laufzeit_delta_sek_summe und laufzeit_messwerte neu rechnen.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -86400
                max_value: 86400
                inclusive: true
      - name: haltezeit_delta_sek_je_zug
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -86400
                max_value: 86400
                inclusive: true
      - name: ausgefallene_halte
        description: Danebengestellt, nie eingerechnet (CLAUDE.md Regel 8).
        tests:
          - not_null
      - name: ausgelassene_halte
        tests:
          - not_null
      - name: halte_zeitumstellung
        description: Halte, die wegen der Umstellungsstunde in keine Kennzahl eingeflossen sind.
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - betriebstag
              - quelle
              - von_stop_id
              - nach_stop_id

  - name: mart_datenqualitaet
    description: >
      Abdeckungsprotokoll je Betriebstag und Quelle (BPULS-024). Belegt, worauf die
      übrigen Kennzahlen stehen: wie viele Halt-Ereignisse einen Ist-Wert hatten und
      aus welchem Grund die übrigen keinen haben. Die Gründe überschneiden sich
      bewusst und werden nie addiert. Nenner sind ausschließlich planmäßig vorhandene
      Ereignisse — am Startbahnhof gibt es keine Ankunft, am Endbahnhof keine
      Abfahrt, und das ist keine Datenlücke. **Feed-Lücken der GTFS-RT-Sammlung
      fehlen noch**, sie kommen mit stg_de_gtfsrt (BPULS-030).
    columns:
      - name: betriebstag
        description: Partitionsschlüssel des inkrementellen Laufs. Ein Betriebstag je Zeile und Quelle.
        tests:
          - not_null
      - name: quelle
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['de_gtfsrt']
      - name: fahrten
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: halte
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: halte_gebietsfremd
        description: >
          Halte außerhalb VRN + RMV (BPULS-075). Sie stehen weiter in mart_zuglauf,
          gehen aber in keine Kennzahl ein. Gemessen an der Stichprobe vom 2026-08-23
          waren das **43,3 %** aller Halte mit bekanntem Namen — Fernverkehrsläufe, die
          der Collector mit ihrem ganzen Laufweg gesammelt hat (Karlsruhe, Köln,
          Nürnberg, Stuttgart, München). Dieselbe Begründung wie bei
          fahrten_gebietsfremd: ein Ausschluss, der nirgends auftaucht, ist von einem
          Datenverlust nicht zu unterscheiden.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: fahrten_gebietsfremd
        description: >
          Fahrten, die der Fremdverkehrsfilter aussortiert hat (BPULS-070) — sie stehen
          in **keinem** anderen Mart. Sie sind über eine Nummernkollision in den
          Scope-Filter geraten: der Nahverkehrsfeed nummeriert seine Halte in einem
          eigenen Kreis, und eine Hannoveraner Bushaltestelle trägt zufällig die Nummer
          eines Bahnhofs im Zielgebiet. Die Zahl steht hier, damit der Ausschluss
          sichtbar ist — ein Ausschluss, der nirgends auftaucht, ist von einem
          Datenverlust nicht zu unterscheiden. 0 heißt „keine aussortiert" **oder**
          „keine Nahverkehrsliste auf dem Volume"; den zweiten Fall meldet
          `stg_de_nahverkehrshalt` im Lauf.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: erhebung_vollstaendig
        description: >
          War die Erhebung an diesem Betriebstag vollständig (BPULS-079)? Ist sie es
          nicht, steht der Tag **hier** weiterhin, geht aber in keine der vier
          Kennzahl-Marts ein. Das ist der Sinn dieser Spalte: fiele der Tag auch aus dem
          Abdeckungsprotokoll, wäre eine Schieflage in der Erhebung von einem
          stillstehenden Collector nicht mehr zu unterscheiden.
        tests:
          - not_null
      - name: erhebung_grund
        description: >
          Was die Erhebung an diesem Tag verzerrt hat, in einem Satz mit Zahlen. NULL an
          einem Tag ohne Befund — nicht ein leerer Text, sonst sähe „kein Befund" wie
          „Grund unbekannt" aus.
      - name: erhebung_referenz
        description: Die Aufgabe, unter der der Vorfall aufgeklärt ist (Präfix BPULS).
      - name: abdeckung_an
        description: >
          Anteil der Halte mit planmäßiger Ankunft, für die eine Ankunftsverspätung
          bestimmbar war. NULL, wenn an diesem Tag kein Halt eine planmäßige Ankunft
          hatte — das ist keine Abdeckung von 0.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: abdeckung_ab
        description: Dasselbe für die Abfahrt.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['betriebstag', 'quelle']


  - name: mart_puenktlichkeit
    description: >
      A5 (BPULS-032): Pünktlichkeit und das, was aus Pünktlichkeitsquoten herausfällt,
      nebeneinander. Korn: Betriebstag × Quelle × Linie × Schwelle. Fünf Schwellen
      (1, 3, 6, 15, 60 Minuten) statt einer Zahl — die branchenübliche 6-Minuten-Grenze
      als Einzelwert verdeckt genau die Fälle, um die es Reisenden geht.

      **Über Schwellen hinweg wird nie summiert.** Jede Zeile ist eine eigene
      Auswertung derselben Grundmenge; alle zählbaren Spalten außer `halte_puenktlich`
      wiederholen sich je Gruppe fünfmal.

      **Der Nenner ist der beobachtete Laufweg, nicht der Fahrplan.** Ein Halt, den der
      Feed nie erwähnt hat, fehlt auch hier. Die Quoten sind damit obere Schranken.
    columns:
      - name: betriebstag
        description: Betriebstag, nicht Kalendertag. Partitionsschlüssel des inkrementellen Laufs.
        tests:
          - not_null
      - name: quelle
        tests:
          - not_null
      - name: route_kurzname
        description: >
          Linie. Bleibt NULL, wo keine Fahrplan-Version die Fahrt kennt — dann steht
          hier eine eigene Gruppe „ohne Liniennummer", keine Zuordnung zu einer
          fremden Linie.
      - name: schwelle_sek
        description: Pünktlichkeitsschwelle in Sekunden. Pünktlich heißt `delay_an_sek < schwelle_sek`.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [60, 180, 360, 900, 3600]
                quote: false
      - name: halte_mit_ankunft
        description: >
          Nenner der ehrlichen Quote: alle beobachteten Halte, an denen planmäßig eine
          Ankunft vorgesehen ist — einschließlich der ausgefallenen, ausgelassenen und
          der ohne Meldung. Der erste Halt eines Laufs zählt nie mit, dort kommt
          planmäßig nichts an.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: halte_gemessen
        description: >
          Nenner der üblichen Quote: nur Halte, für die eine Ankunftsverspätung
          vorliegt.
        tests:
          - not_null
      - name: halte_puenktlich
        description: Teilmenge von `halte_gemessen` mit `delay_an_sek < schwelle_sek`.
        tests:
          - not_null
      - name: halte_ausgefallen
        description: Halte ausgefallener Züge. Nie als Verspätung 0 (CLAUDE.md Regel 8).
        tests:
          - not_null
      - name: halte_unbedienter_lauf
        description: >
          Halte eines Laufs, in dem **kein einziger** Halt bedient wurde (BPULS-064).
          In diesem Feed ist das die Form, in der ein vollständiger Ausfall ankommt —
          er setzt `trip.schedule_relationship = CANCELED` nie, streicht aber die Halte
          einzeln.

          **Abgeleitet, nicht gemeldet.** Anders als `halte_ausgefallen` behauptet die
          Spalte nicht, dass der Zug nicht fuhr, sondern dass im **beobachteten** Lauf
          kein Halt bedient wurde. Eine Fahrt, die erst ab der Mitte beobachtet wurde
          und deren Rest gestrichen war, sieht genauso aus; zu trennen wäre das über
          den Soll-Laufweg.
        tests:
          - not_null
      - name: halte_verkuerzt
        description: >
          Ausgelassene Halte am Anfang oder Ende des Laufs — der Zug fährt, aber
          verkürzt. Für Reisende an diesen Bahnhöfen ein vollständiger Ausfall.
          Setzt mindestens einen bedienten Halt voraus; ohne den greift
          `halte_unbedienter_lauf`.
        tests:
          - not_null
      - name: halte_ausgelassen
        description: Ausgelassene Halte mitten im Lauf.
        tests:
          - not_null
      - name: halte_mehrdeutig
        description: Halte in der Umstellungsstunde — nicht bestimmbar, nicht unpünktlich.
        tests:
          - not_null
      - name: halte_ohne_meldung
        description: >
          Planmäßig vorhanden, nicht ausgefallen, nicht ausgelassen, nicht mehrdeutig —
          und trotzdem keine Ist-Meldung. Nur hier bedeutet ein Anstieg ein Problem der
          Erhebung statt des Betriebs.
        tests:
          - not_null
      - name: fahrten
        description: Fahrten der Gruppe. Je Fahrt einmal gezählt, nicht je Halt.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: fahrten_ausgefallen
        description: >
          Vollständig ausgefallene Fahrten. Zählt auch dann, wenn die Fahrt nur an
          ihrem ersten Halt beobachtet wurde und deshalb keinen Ankunftshalt beisteuert.
        tests:
          - not_null
      - name: fahrten_unbedienter_lauf
        description: >
          Fahrten, in denen kein Halt bedient wurde. Schließt `fahrten_ausgefallen`
          aus (die Rangfolge greift zuerst) und `fahrten_verkuerzt` ebenfalls — die drei
          dürfen deshalb nebeneinander gelesen, aber nicht als „Ausfälle insgesamt"
          addiert werden, ohne dass man weiß, was man addiert.
        tests:
          - not_null
      - name: fahrten_unbedienter_lauf_bestaetigt
        description: >
          Teilmenge von `fahrten_unbedienter_lauf`, bei der der beobachtete Laufweg den
          planmäßigen **vollständig deckt** (`int_de_soll_laufweg`). Nur dort ist
          ausgeschlossen, dass bloß das gestrichene Ende einer sonst gefahrenen Fahrt
          beobachtet wurde.

          Die Differenz zu `fahrten_unbedienter_lauf` ist keine Ungenauigkeit, die man
          wegrechnet — sie ist die Reichweite der Beobachtung und gehört ausgewiesen.
        tests:
          - not_null
      - name: fahrten_unbedienter_lauf_nicht_pruefbar
        description: >
          Teilmenge von `fahrten_unbedienter_lauf`, zu der **kein** Soll-Laufweg
          vorliegt: die `trip_id` steht in keiner zum Betriebstag gültigen
          Fahrplan-Version. Diese Fahrten sind weder belegt noch widerlegt.

          Bis BPULS-066 zählten sie stillschweigend als „nicht belegt". Das war der
          gesamte Unterschied zwischen zwei Betriebstagen (84,4 % gegen 61,3 % belegt),
          und die Gruppe besteht ausschließlich aus Fahrten ohne Liniennummer — der
          Linienname kommt aus derselben Quelle wie der Soll-Laufweg. Eine Aussage über
          die Reichweite der Methode las sich damit als Befund über den Betrieb.
        tests:
          - not_null
      - name: fahrten_verkuerzt
        description: Fahrten mit mindestens einem ausgelassenen Halt am Laufwegsrand.
        tests:
          - not_null
      - name: quote_gemessen
        description: >
          `halte_puenktlich / halte_gemessen` — die übliche Quote. NULL, wenn nichts
          gemessen wurde; das ist keine Pünktlichkeit von 0.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: quote_planmaessig
        description: >
          `halte_puenktlich / halte_mit_ankunft` — die ehrliche Quote. Liegt nie über
          `quote_gemessen`; die Lücke zwischen beiden ist der Befund dieser Analyse.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['betriebstag', 'quelle', 'route_kurzname', 'schwelle_sek']

  - name: mart_bahnhof
    description: >
      A5 je Bahnhof statt je Linie (BPULS-061). Korn: Betriebstag × Quelle × Bahnhof ×
      Schwelle. Grundlage der vorgerenderten Bahnhofsseiten.

      **Geschlüsselt über den Namen, nicht über die stop_id** — die Namensräume rotieren
      zwischen Fahrplan-Versionen (BPULS-073), über die ID zerfiele ein Bahnhof in
      mehrere Zeilen mit je einem Bruchteil seiner Züge. Halte ohne Namen fallen heraus,
      statt unter ihrer Nummer zu erscheinen.

      Die Einordnung eines Halts ist dieselbe wie in `mart_puenktlichkeit` und steht
      genau einmal, im Makro `halt_zustand()`. Was hier dazukommt, ist die Trennung aus
      A1: **mitgebracht** (`verspaetung_an_sek_je_halt`) neben **hier entstanden**
      (`haltezeit_delta_sek_je_halt`).

      **Über Schwellen nie summieren** — jede Zeile ist eine eigene Auswertung derselben
      Grundmenge; die zählbaren Spalten wiederholen sich fünfmal.
    columns:
      - name: betriebstag
        tests:
          - not_null
      - name: quelle
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['de_gtfsrt']
      - name: bahnhof
        description: >
          `stop_name` des Halts. Bahnsteiggruppen bleiben getrennt, weil der Feed sie
          getrennt führt — `Frankfurt(Main)Hbf` und `Frankfurt Hbf (tief)` sind zwei
          Zeilen.
        tests:
          - not_null
      - name: schwelle_sek
        description: Ankunftsverspätung in Sekunden, ab der ein Halt nicht mehr als pünktlich zählt.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [60, 180, 360, 900, 3600]
                quote: false
      - name: ist_knoten
        description: >
          Steht der Bahnhof im Seed `knoten` und bekommt damit eine eigene Seite? Aus
          der Konfiguration, nicht aus den Daten.
        tests:
          - not_null
      - name: verbund
        description: >
          VRN oder RMV aus dem Seed, nur für die Gruppierung der Übersichtsseite. NULL
          für jeden Bahnhof außerhalb der Knotenliste — das ist keine Aussage über
          seinen Verbund, sondern heißt „nicht ausgewählt".
      - name: slug
        description: >
          Der Teil der URL, unter dem die Bahnhofsseite steht. NULL für jeden Bahnhof
          ohne eigene Seite.
      - name: zuege
        description: >
          Zahl unterschiedlicher Fahrten, die an diesem Bahnhof beobachtet wurden —
          einschließlich derer, die hier beginnen und deshalb keine planmäßige Ankunft
          haben. Nicht der Nenner der Quoten, das ist `halte_mit_ankunft`.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
      - name: halte_mit_ankunft
        description: >
          Nenner der ehrlichen Quote: alle Halte, an denen planmäßig ein Zug ankommen
          sollte. Der erste Halt eines Laufs ist nicht dabei — dort kommt planmäßig
          nichts an.
        tests:
          - not_null
      - name: halte_gemessen
        description: >
          Nenner der üblichen Quote: Halte mit einer Ankunftsverspätung.
        tests:
          - not_null
      - name: halte_puenktlich
        tests:
          - not_null
      - name: halte_ausgefallen
        tests:
          - not_null
      - name: halte_unbedienter_lauf
        tests:
          - not_null
      - name: halte_verkuerzt
        tests:
          - not_null
      - name: halte_ausgelassen
        tests:
          - not_null
      - name: halte_mehrdeutig
        tests:
          - not_null
      - name: halte_ohne_meldung
        tests:
          - not_null
      - name: quote_gemessen
        description: >
          `halte_puenktlich / halte_gemessen` — die übliche Quote. NULL, wenn nichts
          gemessen wurde; das ist keine Pünktlichkeit von 0.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: quote_planmaessig
        description: >
          `halte_puenktlich / halte_mit_ankunft` — die ehrliche Quote. Liegt nie über
          `quote_gemessen`.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: verspaetung_an_sek_je_halt
        description: >
          Mitgebracht: mittlere Ankunftsverspätung über die gemessenen Halte. Züge vor
          der Zeit gehen negativ ein — das ist Absicht, sonst sähe ein Bahnhof besser
          aus, weil dort viele Züge zu früh sind. Über mehrere Tage aus Summe und Zähler
          neu rechnen, nicht mitteln.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -86400
                max_value: 86400
                inclusive: true
      - name: haltezeit_delta_sek_je_halt
        description: >
          Hier entstanden: mittlere Differenz zwischen Abfahrts- und Ankunftsverspätung
          an diesem Halt (A1). Positiv heißt, der Aufenthalt hat Zeit gekostet.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -86400
                max_value: 86400
                inclusive: true
      - name: laufzeit_delta_sek_je_halt
        description: >
          Auf dem Weg hierher entstanden — gehört dem Abschnitt davor, nicht dem
          Bahnhof. Nur über lückenlose Abschnitte im Gebiet, wie in
          `mart_verspaetungsentstehung`.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -86400
                max_value: 86400
                inclusive: true
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['betriebstag', 'quelle', 'bahnhof', 'schwelle_sek']

  - name: mart_engpassknoten
    description: >
      A4 (BPULS-033): A1 über die Zeit aggregiert. Korn: Betriebstag × Quelle ×
      Abschnitt (von → nach) × Tagesstunde.

      **Der Abschnitt wird über den Namen geschlüsselt, nicht über die stop_id** — die
      Namensräume rotieren zwischen Fahrplan-Versionen, über die ID zerfiele ein
      physischer Engpass in mehrere Zeilen mit je einem Bruchteil der Züge, und die
      Rangliste wäre still falsch. Wo kein Name bekannt ist, bleibt die ID stehen;
      `bezeichnung_vollstaendig` sagt, ob das der Fall war.

      **Immer je Zug lesen, nie als Rohsumme.** Über Stunden oder Tage hinweg aus
      Summe und Zähler neu rechnen, nicht die je-Zug-Spalten mitteln.
    columns:
      - name: betriebstag
        tests:
          - not_null
      - name: quelle
        tests:
          - not_null
      - name: von_bezeichnung
        description: Name der Betriebsstelle am Abschnittsanfang, ersatzweise deren ID.
        tests:
          - not_null
      - name: nach_bezeichnung
        description: Name der Betriebsstelle am Abschnittsende, ersatzweise deren ID.
        tests:
          - not_null
      - name: stunde
        description: >
          Wanduhrstunde der planmäßigen Ankunft am Zielhalt. NULL, wo keine Soll-Ankunft
          bestimmbar war — diese Zeilen fallen aus der Heatmap, nicht aus der Summe.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 23
      - name: abschnitt_paar
        description: >
          Richtungsunabhängiger Schlüssel des Abschnitts. Beide Fahrtrichtungen tragen
          denselben Wert, damit sich die Asymmetrie eines Abschnitts in einer Abfrage
          gegenüberstellen lässt.
        tests:
          - not_null
      - name: richtung_hin
        description: Unterscheidet die beiden Fahrtrichtungen innerhalb von `abschnitt_paar`.
        tests:
          - not_null
      - name: zuege
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: laufzeit_messwerte
        tests:
          - not_null
      - name: haltezeit_messwerte
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['betriebstag', 'quelle', 'von_bezeichnung', 'nach_bezeichnung', 'stunde']

  - name: mart_pufferbilanz
    description: >
      A2 (BPULS-034): Pufferabbau und Fahrplanqualität. Korn: Betriebstag × Quelle ×
      Linie × Abschnitt (von → nach), Abschnitt über den Namen geschlüsselt.

      **Der Kern ist die Trennung nach Eingangszustand.** Ein Zug, der schneller wird
      als der Fahrplan vorsieht, bedeutet zwei gegensätzliche Dinge: verspätet
      eingefahren und aufgeholt heißt, die Reserve hat gewirkt; pünktlich eingefahren
      und trotzdem früher angekommen heißt, die Fahrzeit ist zu großzügig bemessen.
      Beide werden getrennt gezählt und nie summiert.

      Eine zu **knapp** bemessene Fahrzeit erkennt man dagegen an `verloren`, nicht an
      `aufgeholt`.
    columns:
      - name: betriebstag
        tests:
          - not_null
      - name: quelle
        tests:
          - not_null
      - name: route_kurzname
        description: Linie. NULL, wo keine Fahrplan-Version die Fahrt kennt.
      - name: von_bezeichnung
        tests:
          - not_null
      - name: nach_bezeichnung
        tests:
          - not_null
      - name: abschnitte_bewertbar
        description: >
          Abschnittsdurchfahrten mit bestimmbarem Laufzeitanteil **und** bestimmbarem
          Eingangszustand. Nur diese lassen sich einem der beiden Fälle zuordnen.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: aufgeholt
        description: Laufzeitanteil negativ — der Zug wurde schneller als der Fahrplan vorsieht.
        tests:
          - not_null
      - name: verloren
        description: >
          Laufzeitanteil positiv. Ein hoher Anteil hier ist das Kennzeichen einer zu
          knapp bemessenen Fahrzeit.
        tests:
          - not_null
      - name: unveraendert
        tests:
          - not_null
      - name: verspaetet_eingefahren
        description: Eingangsverspätung über der Pünktlichkeitsgrenze (Vorgabe 60 s, `a2_puenktlich_grenze_sek`).
        tests:
          - not_null
      - name: puenktlich_eingefahren
        tests:
          - not_null
      - name: reserve_genutzt
        description: >
          Verspätet eingefahren und Verspätung abgebaut — die Reserve hat gewirkt. Ein
          hoher Anteil ist ein gutes Zeichen.
        tests:
          - not_null
      - name: reserve_ungenutzt
        description: >
          Pünktlich eingefahren und trotzdem früher angekommen — der Zug brauchte den
          Zuschlag nicht. Ein hoher Anteil heißt: Kapazität, die im Fahrplan verschenkt
          wird.
        tests:
          - not_null
      - name: bilanz_sek
        description: >
          Nettosumme der Laufzeitanteile. Positiv: hier geht Zeit verloren. Der Saldo
          allein verschweigt, ob sich zwei große Effekte aufheben — deshalb stehen die
          Einzelrichtungen daneben.
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['betriebstag', 'quelle', 'route_kurzname', 'von_bezeichnung', 'nach_bezeichnung']

  - name: mart_erhebung
    description: >
      Die Lückenseite der Datenqualität (BPULS-024): nicht was gemeldet wurde, sondern
      **ob** gemeldet wurde. Korn Kalendertag × Stunde × Quelle.

      **Kalendertag, nicht Betriebstag** — und das ist keine Nachlässigkeit. Ein Poll ist
      ein Vorgang der Erhebung, hat keinen Betriebstag, und die Zeilen eines einzigen
      Polls verteilen sich regelmäßig auf zwei. Dieser Mart steht deshalb **neben**
      `mart_datenqualitaet` und wird nie mit ihm verrechnet.

      Die Stunden kommen aus einem Gerüst zwischen erster und letzter Beobachtung, nicht
      aus den Daten: eine Stunde ganz ohne Poll erzeugt keine Zeile und wäre aus einer
      gruppierten Tabelle verschwunden — ausgerechnet aus der, die sie zeigen soll.
    columns:
      - name: kalendertag
        tests:
          - not_null
      - name: stunde
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 23
      - name: quelle
        tests:
          - not_null
      - name: polls_beobachtet
        description: >
          Polls, die mindestens eine Änderung gebracht haben. Ein Poll ganz ohne
          Änderung hinterlässt keine Zeile (ADR-003) — praktisch folgenlos, aber die
          Kennzahl heißt deshalb Abdeckung und nicht Verfügbarkeit.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: polls_erwartet
        description: 3600 / `de_poll_intervall_sek`, also 120 bei 30 s (ADR-011).
        tests:
          - not_null
      - name: abdeckung
        description: >
          `polls_beobachtet / polls_erwartet`. **Nicht gedeckelt** — während eines
          Redeploys pollen zwei Container gleichzeitig, und ein auf 100 % gedeckelter
          Wert verbärge genau den Vorgang, der ihn erzeugt hat.
        tests:
          - not_null
      - name: groesste_luecke_sek
        description: >
          Größter Abstand zwischen zwei Polls, der **in** dieser Stunde endete — eine
          Lücke hält sich nicht an Stundengrenzen. NULL für eine Stunde ganz ohne Poll:
          dort endete keine Lücke, sie lief hindurch, und `polls_beobachtet = 0` sagt es
          deutlicher.
      - name: feed_alter_schnitt_sek
        description: Mittleres Alter der Daten beim Abruf. Gemessen rund 19 s.
      - name: stunde_vollstaendig
        description: >
          Ob über das Ende der Stunde hinaus beobachtet wurde. Nur eine abgeschlossene
          Stunde darf als Befund gelesen werden — sonst wäre die laufende Stunde jedes
          Mal einer, und ein stündlicher Befund wird nicht mehr gelesen.
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['kalendertag', 'stunde', 'quelle']
