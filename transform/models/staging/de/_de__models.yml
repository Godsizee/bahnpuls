version: 2

models:
  - name: stg_de_gtfsrt
    description: >
      Normalisierte GTFS-RT-Momentaufnahmen. **Eine Zeile ist eine Änderung in einem
      Snapshot, kein Halt-Ereignis** — der Collector schreibt nur, was sich gegenüber
      dem vorigen Poll geändert hat. Die Verdichtung auf ein Ereignis je Halt passiert
      in int_de_stop_events. Soll-Zeiten sind rekonstruiert (Prognose minus
      Verspätung), der Feed liefert keine.
    columns:
      - name: betriebstag
        tests:
          - not_null
      - name: trip_key
        tests:
          - not_null
      - name: stop_sequence
        description: >
          Rohe GTFS-Nummer aus dem Fahrplan, **keine Position im Laufweg**: sie beginnt
          je nach Fahrt bei 0, 1 oder höher und kann Lücken haben. Bewusst nicht neu
          indiziert, siehe Modellkommentar.
        tests:
          - not_null
      - name: snapshot_ts
        description: Zeitstempel des Feeds selbst (header.timestamp), nicht die Abrufzeit.
        tests:
          - not_null
      # Zwei Grenzen mit verschiedenen Aufgaben. Die harte faengt Einheiten- und
      # Schemafehler -- waeren die Werte plötzlich Millisekunden, laege alles im
      # Millionenbereich. Die weiche faengt Unplausibles: gemessen am 2026-08-20 liefert
      # der Feed bis zu -83.050 s, also 23 Stunden "zu frueh". Solche Werte gibt es
      # wirklich, deshalb darf der Build daran nicht scheitern -- sie sind aber ein
      # Befund und bleiben als Warnung sichtbar. Entwertet werden sie in
      # int_de_stop_events, nicht hier: Staging normalisiert, es urteilt nicht.
      - name: delay_an_sek
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -604800
                max_value: 604800
          - dbt_utils.accepted_range:
              config:
                severity: warn
                alias: warn_delay_an_unplausibel
              arguments:
                min_value: -3600
                max_value: 86400
      - name: delay_ab_sek
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -604800
                max_value: 604800
          - dbt_utils.accepted_range:
              config:
                severity: warn
                alias: warn_delay_ab_unplausibel
              arguments:
                min_value: -3600
                max_value: 86400
      - name: quelle
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['de_gtfsrt']

  - name: stg_de_erhebung
    description: >
      Die Erhebung selbst, nicht ihr Inhalt (BPULS-024): je Rohzeile der Zeitpunkt des
      Polls und der Zeitstempel des Feeds, beide in `Europe/Berlin`.

      Liest **direkt aus der Quelle**, nicht aus `stg_de_gtfsrt` — das dortige Modell
      filtert `is_trip_level_only` heraus, und ein Poll, der nur solche Meldungen
      brachte, zählte hier sonst fälschlich als Ausfall.
    columns:
      - name: fetched_at
        description: Wanduhrzeit des Polls, nie ein Betriebstag.
        tests:
          - not_null
      - name: snapshot_ts
        description: Zeitstempel im Feed-Header. Die Differenz ist das Alter der Daten.
      - name: quelle
        tests:
          - not_null

  - name: stg_de_fahrplanhalt
    description: >
      Soll-Halte aus dem statischen Fahrplan, je Version und Feed. Reine
      Typisierung — welche Version für welchen Betriebstag gilt, entscheidet
      `int_de_ausfaelle` (CLAUDE.md Regel 9).

      Zeiten liegen als **Sekunden seit Betriebstagsbeginn** vor, nicht als Uhrzeit:
      GTFS lässt Werte wie `25:30:00` ausdrücklich zu, und jeder Zeit-Typ verlöre
      dabei die Zuordnung zum Betriebstag.
    columns:
      - name: static_version
        tests:
          - not_null
      - name: feed
        tests:
          - not_null
      - name: trip_id
        tests:
          - not_null
      - name: stop_sequence
        tests:
          - not_null
      - name: soll_an_sek
        description: NULL am ersten Halt — dort ist planmäßig keine Ankunft vorgesehen.
      - name: soll_ab_sek
        description: NULL am letzten Halt.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['static_version', 'feed', 'trip_id', 'stop_sequence']

  - name: stg_de_fahrtmeldung
    description: >
      Meldungen über eine ganze Fahrt ohne einzelne Halte — so kommt ein
      vollständiger Ausfall im GTFS-RT-Feed an. Genaues Gegenstück zum Filter in
      `stg_de_gtfsrt`: die beiden Mengen sind disjunkt und zusammen vollständig.
    columns:
      - name: betriebstag
        tests:
          - not_null
      - name: trip_key
        tests:
          - not_null
      - name: zug_ausgefallen
        tests:
          - not_null

  - name: stg_de_nahverkehrshalt
    description: >
      Halte des Nahverkehrsfeeds, vereinigt über alle Versionen — **keine
      Fahrplanquelle, sondern eine Negativliste** (BPULS-070). Sie beantwortet genau
      eine Frage: kennt der Nahverkehr diese `stop_id` überhaupt? Fehlt die Datei auf
      dem Volume, bleibt die View leer und der Lauf trägt eine Warnung; Fremdverkehr
      zählt dann in allen Kennzahlen mit, aber nicht stillschweigend.
    columns:
      - name: stop_id
        description: Haltenummer im Nummernkreis des Nahverkehrsfeeds.
        tests:
          - unique
      - name: stop_name
        description: >
          Name zur Nachvollziehbarkeit eines Befundes („welche Haltestelle war das?").
          Geht in keine Kennzahl ein — die Namen der beiden Nummernkreise dürfen nicht
          vermischt werden.
