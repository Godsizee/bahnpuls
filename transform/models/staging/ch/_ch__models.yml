version: 2

models:
  - name: stg_ch_istdaten
    description: >
      CH-Ist-Daten (Spur A), normalisiert auf das fct_stop_events-Schema
      (siehe Bahnpuls_Datenmodell.md). Nur PRODUKT_ID='Zug', ein Halt-Ereignis
      je Zeile (Ankunft und Abfahrt bereits zusammen).
    columns:
      - name: trip_key
        description: betriebstag + trip_id, eindeutig über Tage.
        tests:
          - not_null
      - name: stop_sequence
        description: Aus der Soll-Zeit hergeleitet (CH liefert keine eigene Spalte), ab 1.
        tests:
          - not_null
      - name: betriebstag
        tests:
          - not_null
      - name: delay_an_sek
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -3600
                max_value: 86400
                inclusive: true
      - name: delay_ab_sek
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -3600
                max_value: 86400
                inclusive: true
      - name: quelle
        tests:
          - accepted_values:
              arguments:
                values: ['ch_istdaten']
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - trip_key
              - stop_sequence
