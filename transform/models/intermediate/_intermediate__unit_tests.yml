version: 2

unit_tests:
  - name: int_segment_ausgelassener_halt_bricht_abschnitt_nicht
    description: >
      Ein ausgelassener Halt bleibt in der Reihenfolge stehen und trägt keine
      Verspätung. Der Folgeabschnitt darf ihn nicht überspringen — sonst würden
      zwei nicht benachbarte Betriebsstellen als direkte Fahrt ausgewiesen.
    model: int_segment_delta
    given:
      - input: ref('fct_stop_events')
        rows:
          - {trip_key: 't1', stop_sequence: 1, betriebstag: '2026-08-11', stop_id: 'A', stop_name: 'A', delay_an_sek: null, delay_ab_sek: 60,  halt_ausgelassen: false, zug_ausgefallen: false}
          - {trip_key: 't1', stop_sequence: 2, betriebstag: '2026-08-11', stop_id: 'B', stop_name: 'B', delay_an_sek: 300, delay_ab_sek: 320, halt_ausgelassen: true,  zug_ausgefallen: false}
          - {trip_key: 't1', stop_sequence: 3, betriebstag: '2026-08-11', stop_id: 'C', stop_name: 'C', delay_an_sek: 400, delay_ab_sek: 420, halt_ausgelassen: false, zug_ausgefallen: false}
    expect:
      rows:
        - {trip_key: 't1', nach_stop_sequence: 1, von_stop_id: null, abschnitt_direkt: null, delay_an_sek: null, delay_ab_sek: 60,   laufzeit_delta_sek: null, haltezeit_delta_sek: null}
        - {trip_key: 't1', nach_stop_sequence: 2, von_stop_id: 'A',  abschnitt_direkt: true, delay_an_sek: null, delay_ab_sek: null, laufzeit_delta_sek: null, haltezeit_delta_sek: null}
        - {trip_key: 't1', nach_stop_sequence: 3, von_stop_id: 'B',  abschnitt_direkt: true, delay_an_sek: 400,  delay_ab_sek: 420,  laufzeit_delta_sek: null, haltezeit_delta_sek: 20}

  - name: int_segment_ausfall_ist_nicht_verspaetung_null
    description: >
      Ein ausgefallener Zug hat keine Verspätung, nicht die Verspätung 0
      (CLAUDE.md Regel 8). Alle Deltas NULL, die Zeilen bleiben vollständig erhalten.
    model: int_segment_delta
    given:
      - input: ref('fct_stop_events')
        rows:
          - {trip_key: 't2', stop_sequence: 1, betriebstag: '2026-08-11', stop_id: 'A', stop_name: 'A', delay_an_sek: null, delay_ab_sek: 0, halt_ausgelassen: false, zug_ausgefallen: true}
          - {trip_key: 't2', stop_sequence: 2, betriebstag: '2026-08-11', stop_id: 'B', stop_name: 'B', delay_an_sek: 0, delay_ab_sek: 0, halt_ausgelassen: false, zug_ausgefallen: true}
    expect:
      rows:
        - {trip_key: 't2', nach_stop_sequence: 1, delay_an_sek: null, delay_ab_sek: null, laufzeit_delta_sek: null, haltezeit_delta_sek: null, zug_ausgefallen: true}
        - {trip_key: 't2', nach_stop_sequence: 2, delay_an_sek: null, delay_ab_sek: null, laufzeit_delta_sek: null, haltezeit_delta_sek: null, zug_ausgefallen: true}

  - name: int_segment_kein_uebergriff_zwischen_fahrten
    description: >
      lag() darf nie über eine Fahrtgrenze greifen. Sonst erscheint am Anfang einer
      Fahrt ein Laufzeitverlust, der aus einer fremden Fahrt stammt — plausibel
      aussehend und dadurch besonders teuer.
    model: int_segment_delta
    given:
      - input: ref('fct_stop_events')
        rows:
          - {trip_key: 't3', stop_sequence: 1, betriebstag: '2026-08-11', stop_id: 'A', stop_name: 'A', delay_an_sek: null, delay_ab_sek: 600, halt_ausgelassen: false, zug_ausgefallen: false}
          - {trip_key: 't3', stop_sequence: 2, betriebstag: '2026-08-11', stop_id: 'B', stop_name: 'B', delay_an_sek: 660, delay_ab_sek: 660, halt_ausgelassen: false, zug_ausgefallen: false}
          - {trip_key: 't4', stop_sequence: 1, betriebstag: '2026-08-11', stop_id: 'C', stop_name: 'C', delay_an_sek: null, delay_ab_sek: 0,   halt_ausgelassen: false, zug_ausgefallen: false}
          - {trip_key: 't4', stop_sequence: 2, betriebstag: '2026-08-11', stop_id: 'D', stop_name: 'D', delay_an_sek: -120, delay_ab_sek: -60, halt_ausgelassen: false, zug_ausgefallen: false}
    expect:
      rows:
        - {trip_key: 't3', nach_stop_sequence: 1, von_stop_sequence: null, laufzeit_delta_sek: null, haltezeit_delta_sek: null}
        - {trip_key: 't3', nach_stop_sequence: 2, von_stop_sequence: 1, laufzeit_delta_sek: 60, haltezeit_delta_sek: 0}
        - {trip_key: 't4', nach_stop_sequence: 1, von_stop_sequence: null, laufzeit_delta_sek: null, haltezeit_delta_sek: null}
        # Negativer Laufzeitanteil ist Pufferabbau (A2), kein Fehler und keine Null.
        - {trip_key: 't4', nach_stop_sequence: 2, von_stop_sequence: 1, laufzeit_delta_sek: -120, haltezeit_delta_sek: 60}

  - name: int_de_dubletten_aendern_das_ergebnis_nicht
    description: >
      Beim Redeploy startet Coolify den neuen Container, bevor es den alten stoppt —
      am 2026-08-20 schrieben beide zwei Minuten lang gleichzeitig auf dasselbe
      Volume, dazu der Kaltstart-Burst des neuen Containers mit leerem
      Dedup-Tracker. Dieselbe Momentaufnahme steht danach mehrfach in den Rohdaten.
      Das ist die bessere von zwei Möglichkeiten (eine Lücke wäre nicht
      nachlieferbar, eine Dublette schon) und betrifft **jeden** künftigen Deploy.

      Hier steht deshalb jede Momentaufnahme doppelt. Die Verdichtung auf ein
      Halt-Ereignis muss davon unberührt bleiben — nicht weil dedupliziert würde,
      sondern weil das Korn der Verdichtung (trip_key, stop_sequence) die Dublette
      verschluckt. Der Test nagelt genau diese Eigenschaft fest: wer die Verdichtung
      später gegen eine Aggregation über Rohzeilen tauscht, zählt sonst still doppelt.
    model: int_de_stop_events
    given:
      # Leer: dieser Test prueft die Verdichtung beobachteter Halte. Aufgeloeste
      # Ausfaelle kommen ueber einen eigenen Zweig herein (BPULS-032) und wuerden
      # hier nur Rauschen beitragen -- die Eingabe muss dbt trotzdem kennen.
      - input: ref('int_de_ausfaelle')
        rows: []
      - input: ref('stg_de_static')
        rows:
          - {art: 'stop',  schluessel: 'A', bezeichnung: 'Bahnhof A'}
          - {art: 'stop',  schluessel: 'B', bezeichnung: 'Bahnhof B'}
          - {art: 'linie', schluessel: 'trip1', bezeichnung: 'RE 5'}
      - input: ref('stg_de_gtfsrt')
        rows:
          # Starthalt, kein Ankunftsereignis. Zwei Momentaufnahmen, jede doppelt.
          - {betriebstag: '2026-08-13', trip_key: '2026-08-13_trip1', trip_id: 'trip1', stop_sequence: 1, stop_id: 'A', soll_an: null, soll_ab: '2026-08-13 10:00:00', ist_an: null, ist_ab: '2026-08-13 10:00:30', delay_an_sek: null, delay_ab_sek: 30,  halt_ausgelassen: false, zug_ausgefallen: false, snapshot_ts: '2026-08-13 09:50:00', quelle: 'de_gtfsrt'}
          - {betriebstag: '2026-08-13', trip_key: '2026-08-13_trip1', trip_id: 'trip1', stop_sequence: 1, stop_id: 'A', soll_an: null, soll_ab: '2026-08-13 10:00:00', ist_an: null, ist_ab: '2026-08-13 10:00:30', delay_an_sek: null, delay_ab_sek: 30,  halt_ausgelassen: false, zug_ausgefallen: false, snapshot_ts: '2026-08-13 09:50:00', quelle: 'de_gtfsrt'}
          - {betriebstag: '2026-08-13', trip_key: '2026-08-13_trip1', trip_id: 'trip1', stop_sequence: 1, stop_id: 'A', soll_an: null, soll_ab: '2026-08-13 10:00:00', ist_an: null, ist_ab: '2026-08-13 10:02:00', delay_an_sek: null, delay_ab_sek: 120, halt_ausgelassen: false, zug_ausgefallen: false, snapshot_ts: '2026-08-13 09:58:00', quelle: 'de_gtfsrt'}
          - {betriebstag: '2026-08-13', trip_key: '2026-08-13_trip1', trip_id: 'trip1', stop_sequence: 1, stop_id: 'A', soll_an: null, soll_ab: '2026-08-13 10:00:00', ist_an: null, ist_ab: '2026-08-13 10:02:00', delay_an_sek: null, delay_ab_sek: 120, halt_ausgelassen: false, zug_ausgefallen: false, snapshot_ts: '2026-08-13 09:58:00', quelle: 'de_gtfsrt'}
          # Zwischenhalt. Die dritte Momentaufnahme liegt jenseits der Karenz: sie
          # entscheidet noch, ob der Wert endgueltig ist, aber nicht mehr, wie hoch.
          - {betriebstag: '2026-08-13', trip_key: '2026-08-13_trip1', trip_id: 'trip1', stop_sequence: 2, stop_id: 'B', soll_an: '2026-08-13 10:20:00', soll_ab: '2026-08-13 10:22:00', ist_an: '2026-08-13 10:22:00', ist_ab: '2026-08-13 10:24:00', delay_an_sek: 120, delay_ab_sek: 120, halt_ausgelassen: false, zug_ausgefallen: false, snapshot_ts: '2026-08-13 10:05:00', quelle: 'de_gtfsrt'}
          - {betriebstag: '2026-08-13', trip_key: '2026-08-13_trip1', trip_id: 'trip1', stop_sequence: 2, stop_id: 'B', soll_an: '2026-08-13 10:20:00', soll_ab: '2026-08-13 10:22:00', ist_an: '2026-08-13 10:22:00', ist_ab: '2026-08-13 10:24:00', delay_an_sek: 120, delay_ab_sek: 120, halt_ausgelassen: false, zug_ausgefallen: false, snapshot_ts: '2026-08-13 10:05:00', quelle: 'de_gtfsrt'}
          - {betriebstag: '2026-08-13', trip_key: '2026-08-13_trip1', trip_id: 'trip1', stop_sequence: 2, stop_id: 'B', soll_an: '2026-08-13 10:20:00', soll_ab: '2026-08-13 10:22:00', ist_an: '2026-08-13 10:23:00', ist_ab: '2026-08-13 10:26:00', delay_an_sek: 180, delay_ab_sek: 240, halt_ausgelassen: false, zug_ausgefallen: false, snapshot_ts: '2026-08-13 10:24:00', quelle: 'de_gtfsrt'}
          - {betriebstag: '2026-08-13', trip_key: '2026-08-13_trip1', trip_id: 'trip1', stop_sequence: 2, stop_id: 'B', soll_an: '2026-08-13 10:20:00', soll_ab: '2026-08-13 10:22:00', ist_an: '2026-08-13 10:23:00', ist_ab: '2026-08-13 10:26:00', delay_an_sek: 180, delay_ab_sek: 240, halt_ausgelassen: false, zug_ausgefallen: false, snapshot_ts: '2026-08-13 10:24:00', quelle: 'de_gtfsrt'}
          - {betriebstag: '2026-08-13', trip_key: '2026-08-13_trip1', trip_id: 'trip1', stop_sequence: 2, stop_id: 'B', soll_an: '2026-08-13 10:20:00', soll_ab: '2026-08-13 10:22:00', ist_an: '2026-08-13 10:23:00', ist_ab: '2026-08-13 10:26:00', delay_an_sek: 180, delay_ab_sek: 240, halt_ausgelassen: false, zug_ausgefallen: false, snapshot_ts: '2026-08-13 10:30:00', quelle: 'de_gtfsrt'}
          - {betriebstag: '2026-08-13', trip_key: '2026-08-13_trip1', trip_id: 'trip1', stop_sequence: 2, stop_id: 'B', soll_an: '2026-08-13 10:20:00', soll_ab: '2026-08-13 10:22:00', ist_an: '2026-08-13 10:23:00', ist_ab: '2026-08-13 10:26:00', delay_an_sek: 180, delay_ab_sek: 240, halt_ausgelassen: false, zug_ausgefallen: false, snapshot_ts: '2026-08-13 10:30:00', quelle: 'de_gtfsrt'}
    expect:
      rows:
        - {trip_key: '2026-08-13_trip1', stop_sequence: 1, stop_name: 'Bahnhof A', route_kurzname: 'RE 5', delay_an_sek: null, delay_ab_sek: 120, ist_endgueltig: false}
        - {trip_key: '2026-08-13_trip1', stop_sequence: 2, stop_name: 'Bahnhof B', route_kurzname: 'RE 5', delay_an_sek: 180, delay_ab_sek: 240, ist_endgueltig: true}

  # Regel 9 ist hier die eigentliche Fallgrube: der Laufweg einer Fahrt ist
  # Fahrplaninhalt und aendert sich mit der Version. Gejoint werden muss gegen die
  # zum Betriebstag **gueltige** Version -- nicht gegen die neueste (die kann den
  # Laufweg laengst geaendert haben) und nicht ueber alle vereinigt (das mischte
  # zwei Laufwege zu einem, der nie gefahren wurde).
  #
  # In echten Daten faellt eine falsche Wahl nicht auf: der Laufweg saehe
  # vollstaendig und plausibel aus. Deshalb ein Unit-Test mit drei Versionen --
  # eine aeltere, die gueltige, und eine, die erst **nach** dem Betriebstag
  # veroeffentlicht wurde.
  - name: int_de_ausfaelle_nimmt_die_zum_betriebstag_gueltige_version
    model: int_de_ausfaelle
    given:
      - input: ref('stg_de_fahrtmeldung')
        rows:
          - {betriebstag: '2026-08-13', trip_key: '2026-08-13_t1', trip_id: 't1', zug_ausgefallen: true, snapshot_ts: '2026-08-14 02:00:00', quelle: 'de_gtfsrt'}
      # Keine beobachteten Halte: sonst braeuchte die Fahrt keine Aufloesung.
      - input: ref('stg_de_gtfsrt')
        rows: []
      - input: ref('stg_de_static')
        rows:
          - {art: 'stop',  schluessel: 'B', bezeichnung: 'Bahnhof B'}
          - {art: 'linie', schluessel: 't1', bezeichnung: 'RE 1'}
      - input: ref('stg_de_fahrplanhalt')
        rows:
          # Zu alt: gueltig bis zum 12.08., danach abgeloest.
          - {static_version: '2026-08-06', feed: 'rv', trip_id: 't1', stop_sequence: 0, stop_id: 'ALT', soll_an_sek: null, soll_ab_sek: 28800}
          - {static_version: '2026-08-06', feed: 'rv', trip_id: 't1', stop_sequence: 1, stop_id: 'ALT2', soll_an_sek: 30600, soll_ab_sek: null}
          # Gueltig fuer den 13.08. Der letzte Halt liegt bei 25:00:00 -- eine
          # gueltige GTFS-Zeit, die auf den naechsten Kalendertag faellt und
          # trotzdem zu diesem Betriebstag gehoert (Regel 6).
          - {static_version: '2026-08-13', feed: 'rv', trip_id: 't1', stop_sequence: 0, stop_id: 'A', soll_an_sek: null,  soll_ab_sek: 28800}
          - {static_version: '2026-08-13', feed: 'rv', trip_id: 't1', stop_sequence: 1, stop_id: 'B', soll_an_sek: 30600, soll_ab_sek: 30720}
          - {static_version: '2026-08-13', feed: 'rv', trip_id: 't1', stop_sequence: 2, stop_id: 'C', soll_an_sek: 90000, soll_ab_sek: null}
          # Erst nach dem Betriebstag veroeffentlicht: darf nicht gewinnen, obwohl
          # es die neueste Version ist.
          - {static_version: '2026-08-20', feed: 'rv', trip_id: 't1', stop_sequence: 0, stop_id: 'NEU', soll_an_sek: null,  soll_ab_sek: 28800}
          - {static_version: '2026-08-20', feed: 'rv', trip_id: 't1', stop_sequence: 1, stop_id: 'NEU2', soll_an_sek: 30600, soll_ab_sek: null}
    expect:
      rows:
        - {stop_sequence: 0, stop_id: 'A', soll_an: null,                  soll_ab: '2026-08-13 08:00:00', zug_ausgefallen: true, delay_an_sek: null, ist_endgueltig: true, route_kurzname: 'RE 1'}
        - {stop_sequence: 1, stop_id: 'B', soll_an: '2026-08-13 08:30:00', soll_ab: '2026-08-13 08:32:00', zug_ausgefallen: true, delay_an_sek: null, ist_endgueltig: true, route_kurzname: 'RE 1'}
        - {stop_sequence: 2, stop_id: 'C', soll_an: '2026-08-14 01:00:00', soll_ab: null,                  zug_ausgefallen: true, delay_an_sek: null, ist_endgueltig: true, route_kurzname: 'RE 1'}

  - name: int_de_ein_halt_bleibt_ein_halt_wenn_die_stop_id_wandert
    description: >
      Der Feed nennt die stop_id nicht in jeder Meldung zu einem Halt, und er kann
      sie im Lauf einer Fahrt auch wechseln. Beides ist eine Aussage über
      **denselben** Halt — die Fahrplannummer `stop_sequence` ist der Schlüssel, die
      stop_id nur eine Beschriftung daran.

      Ein `select distinct` über beide Spalten macht daraus zwei Halte, und zwar
      lautlos: die zweite Zeile trägt dieselben Zeiten und sieht vollkommen plausibel
      aus. Nachgelagert zählt jeder Halt doppelt, und `int_de_soll_laufweg` hält einen
      Laufweg gegen den Fahrplan, den es so nie gab.

      Genau das ist am 2026-08-22 in Produktion eingetreten (BPULS-065): der
      stündliche Rebuild brach ab 09:20 UTC mit 81 bis 401 Dubletten in
      `int_de_stop_events` ab, und das Dashboard fror auf dem Datenstand von 08:20 ein.

      Zwei Fahrten, damit beide Formen abgedeckt sind und sich nicht gegenseitig
      erklären: bei `trip1` fehlt die stop_id in der späteren Meldung, bei `trip2`
      ist sie eine andere. In beiden Fällen gilt die **zuletzt genannte** — dieselbe
      Regel, nach der auch der Ist-Wert bestimmt wird.
    model: int_de_stop_events
    given:
      - input: ref('int_de_ausfaelle')
        rows: []
      - input: ref('stg_de_static')
        rows:
          - {art: 'stop',  schluessel: 'A', bezeichnung: 'Bahnhof A'}
          - {art: 'stop',  schluessel: 'B', bezeichnung: 'Bahnhof B'}
          - {art: 'linie', schluessel: 'trip1', bezeichnung: 'RE 5'}
          - {art: 'linie', schluessel: 'trip2', bezeichnung: 'RE 6'}
      - input: ref('stg_de_gtfsrt')
        rows:
          # trip1: erst mit stop_id, danach ohne. stg_de_gtfsrt macht aus dem leeren
          # Feld des Feeds ein NULL -- fuer distinct ist das ein eigener Wert.
          - {betriebstag: '2026-08-13', trip_key: '2026-08-13_trip1', trip_id: 'trip1', stop_sequence: 1, stop_id: 'A',  soll_an: '2026-08-13 10:00:00', soll_ab: '2026-08-13 10:02:00', ist_an: '2026-08-13 10:01:00', ist_ab: '2026-08-13 10:03:00', delay_an_sek: 60, delay_ab_sek: 60, halt_ausgelassen: false, zug_ausgefallen: false, snapshot_ts: '2026-08-13 09:50:00', quelle: 'de_gtfsrt'}
          - {betriebstag: '2026-08-13', trip_key: '2026-08-13_trip1', trip_id: 'trip1', stop_sequence: 1, stop_id: null, soll_an: '2026-08-13 10:00:00', soll_ab: '2026-08-13 10:02:00', ist_an: '2026-08-13 10:02:00', ist_ab: '2026-08-13 10:04:00', delay_an_sek: 120, delay_ab_sek: 120, halt_ausgelassen: false, zug_ausgefallen: false, snapshot_ts: '2026-08-13 09:58:00', quelle: 'de_gtfsrt'}
          # trip2: die stop_id wechselt. Der spaetere Stand gilt.
          - {betriebstag: '2026-08-13', trip_key: '2026-08-13_trip2', trip_id: 'trip2', stop_sequence: 1, stop_id: 'A',  soll_an: '2026-08-13 11:00:00', soll_ab: '2026-08-13 11:02:00', ist_an: '2026-08-13 11:00:00', ist_ab: '2026-08-13 11:02:00', delay_an_sek: 0,  delay_ab_sek: 0,  halt_ausgelassen: false, zug_ausgefallen: false, snapshot_ts: '2026-08-13 10:50:00', quelle: 'de_gtfsrt'}
          - {betriebstag: '2026-08-13', trip_key: '2026-08-13_trip2', trip_id: 'trip2', stop_sequence: 1, stop_id: 'B',  soll_an: '2026-08-13 11:00:00', soll_ab: '2026-08-13 11:02:00', ist_an: '2026-08-13 11:03:00', ist_ab: '2026-08-13 11:05:00', delay_an_sek: 180, delay_ab_sek: 180, halt_ausgelassen: false, zug_ausgefallen: false, snapshot_ts: '2026-08-13 10:58:00', quelle: 'de_gtfsrt'}
    expect:
      rows:
        - {trip_key: '2026-08-13_trip1', stop_sequence: 1, stop_id: 'A', stop_name: 'Bahnhof A', delay_an_sek: 120, delay_ab_sek: 120}
        - {trip_key: '2026-08-13_trip2', stop_sequence: 1, stop_id: 'B', stop_name: 'Bahnhof B', delay_an_sek: 180, delay_ab_sek: 180}
