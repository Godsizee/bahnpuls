version: 2

models:
  - name: int_de_gebietsfremd
    description: >
      Je Fahrt die Entscheidung, ob sie überhaupt Bahnverkehr im Zielgebiet ist
      (BPULS-070). Der Scope-Filter des Collectors ist eine `stop_id`-Liste aus dem
      Bahnfahrplan; seit dem 2026-08-22 führt der Echtzeit-Feed auch Nahverkehr aus
      dem ganzen Bundesgebiet, dessen Nummernkreis mit unserem kollidiert. Erst das
      Verhältnis über **alle** Halte einer Fahrt trennt beides — eine einzelne Nummer
      kann in beiden Nummernkreisen etwas bedeuten.
    columns:
      - name: betriebstag
        tests:
          - not_null
      - name: trip_key
        description: betriebstag + trip_id, hier je Fahrt genau einmal.
        tests:
          - not_null
          - unique
      - name: halte
        description: Zahl der verschiedenen Halte der Fahrt, Nenner der Entscheidung.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
      - name: halte_bahnfahrplan
        description: davon im statischen Bahnfahrplan auflösbar.
        tests:
          - not_null
      - name: halte_nur_nahverkehr
        description: >
          davon ausschließlich im Nahverkehrsfeed auflösbar. Halte, die **beide**
          Nummernkreise kennen, zählen hier nicht — sie entscheiden nichts.
        tests:
          - not_null
      - name: gebietsfremd
        description: >
          true, wenn mehr Halte nur im Nahverkehr aufgehen als im Bahnfahrplan. Bei
          Gleichstand — insbesondere 0 zu 0 — bleibt die Fahrt drin: nicht prüfbar ist
          nicht widerlegt (dieselbe Regel wie bei der Laufweg-Belegquote, BPULS-066).
        tests:
          - not_null

  - name: fct_stop_events
    description: >
      Zentrale Faktentabelle, ein Halt-Ereignis je Zeile (Schema in
      Bahnpuls_Datenmodell.md). Vereinigt alle Quellen; aktuell haengt genau ein
      Zweig daran (int_de_stop_events), die Naht bleibt der Ort, an dem eine weitere
      Quelle andockt. Enthaelt Ausfaelle und ausgelassene Halte bewusst mit --
      gefiltert wird erst dort, wo es fachlich noetig ist (CLAUDE.md Regel 8).
    columns:
      - name: betriebstag
        description: Betriebstag, nicht Kalendertag (siehe Fallstricke im Datenmodell).
        tests:
          - not_null
      - name: trip_key
        description: betriebstag + trip_id, eindeutig über Tage.
        tests:
          - not_null
      - name: stop_sequence
        description: Position im Laufweg, ab 1, je trip_key lückenlos aufsteigend.
        tests:
          - not_null
      - name: delay_an_sek
        description: Ankunftsverspätung in Sekunden, positiv = zu spät.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -3600
                max_value: 86400
                inclusive: true
      - name: delay_ab_sek
        description: Abfahrtsverspätung in Sekunden, positiv = zu spät.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -3600
                max_value: 86400
                inclusive: true
      - name: halt_ausgelassen
        tests:
          - not_null
      - name: zug_ausgefallen
        tests:
          - not_null
      - name: halt_im_gebiet
        description: >
          Liegt der Halt in VRN + RMV (BPULS-075)? Entschieden gegen die Gebietsliste
          `config/scope_stops.csv`: **wo ein Name bekannt ist, entscheidet der Name**,
          die stop_id trägt nur die Halte ohne Namen. Der Name muss es sein, weil die
          IDs zwischen Fahrplanversionen rotieren — und er muss den Vorrang haben, weil
          die Nummernkreise kollidieren (sonst steht Klandorf im Rhein-Main-Gebiet).
          Halte außerhalb bleiben als Zeile stehen (sonst spannt lag() den Abschnitt
          über sie hinweg), gehen aber in keine Kennzahl ein.
        tests:
          - not_null
      - name: quelle
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['de_gtfsrt']
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - trip_key
              - stop_sequence

  - name: int_segment_delta
    description: >
      A1 — Zerlegung der Verspätungsänderung in Laufzeit- und Haltezeitanteil, eine
      Zeile je Halt-Ereignis, Reihenfolge und Anzahl identisch zu fct_stop_events.
      NULL in den Delta-Spalten heißt "nicht bestimmbar", nie "keine Veränderung" —
      auch Ausfälle und ausgelassene Halte landen dort als NULL, nicht als 0.
    columns:
      - name: betriebstag
        tests:
          - not_null
      - name: trip_key
        tests:
          - not_null
      - name: nach_stop_sequence
        description: Halt, an dem der Abschnitt endet; identisch mit stop_sequence der Faktentabelle.
        tests:
          - not_null
      - name: von_halt_im_gebiet
        description: >
          Lag der **Vorhalt** in VRN + RMV? NULL am ersten Halt einer Fahrt — dort gibt
          es keinen Vorhalt, und "unbekannt" ist die richtige Antwort statt "nein".
      - name: nach_halt_im_gebiet
        description: Liegt der Halt, an dem der Abschnitt endet, in VRN + RMV?
        tests:
          - not_null
      - name: abschnitt_im_gebiet
        description: >
          Beide Endpunkte im Gebiet (BPULS-075). **Die Bedingung jedes Aggregats.** Am
          ersten Halt einer Fahrt false, nicht NULL: es gibt keinen Abschnitt, über den
          etwas unbekannt sein könnte.
        tests:
          - not_null
      - name: laufzeit_delta_sek
        description: >
          delay_an(n) − delay_ab(n−1). Negativ = Pufferabbau (A2), kein Fehler.
          NULL am ersten Halt einer Fahrt und überall dort, wo eine der beiden
          Verspätungen fehlt.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -86400
                max_value: 86400
                inclusive: true
      - name: haltezeit_delta_sek
        description: >
          delay_ab(n) − delay_an(n). NULL, wo nur eine der beiden Zeiten gemeldet
          wurde — der Anteil ist dann nicht bestimmbar.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -86400
                max_value: 86400
                inclusive: true
      - name: abschnitt_direkt
        description: >
          Wahr, wenn der Vorhalt unmittelbar vorausgeht (von_stop_sequence + 1).
          NULL am ersten Halt einer Fahrt.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - trip_key
              - nach_stop_sequence

  - name: int_de_stop_events
    description: >
      Verdichtet die GTFS-RT-Momentaufnahmen auf ein Halt-Ereignis je Halt und bringt
      sie auf das fct_stop_events-Schema (BPULS-030). Als Ist gilt der zeitlich letzte
      Wert, der bis Soll + Karenz gemeldet wurde; die Karenz ist eine Annahme
      (`de_ist_karenz_minuten`, Standard 5) und steht auf der Methodik-Seite.
      stop_name, route_kurzname und block_id sind durchgängig NULL — der freie
      Echtzeit-Feed liefert keinen Stationsnamen, route_id ist zu 100 % leer, und
      block_id gibt es dort gar nicht.
    columns:
      - name: betriebstag
        tests:
          - not_null
      - name: trip_key
        tests:
          - not_null
      - name: stop_sequence
        tests:
          - not_null
      - name: halt_im_gebiet
        description: >
          Liegt der Halt in VRN + RMV (BPULS-075)? Entschieden gegen die Gebietsliste
          `config/scope_stops.csv`: **wo ein Name bekannt ist, entscheidet der Name**,
          die stop_id trägt nur die Halte ohne Namen. Der Name muss es sein, weil die
          IDs zwischen Fahrplanversionen rotieren — und er muss den Vorrang haben, weil
          die Nummernkreise kollidieren (sonst steht Klandorf im Rhein-Main-Gebiet).
          Halte außerhalb bleiben als Zeile stehen (sonst spannt lag() den Abschnitt
          über sie hinweg), gehen aber in keine Kennzahl ein.
        tests:
          - not_null
      - name: quelle
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['de_gtfsrt']
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['trip_key', 'stop_sequence']


  - name: int_de_erhebung
    description: >
      Ein Poll je Zeile, mit dem Abstand zum vorigen (BPULS-024). Der Abstand ist die
      eigentliche Kennzahl: Polls zu zählen sagt, wie oft es geklappt hat — der Abstand
      sagt, wie lange nicht.

      Von der Dublettenfrage nicht betroffen: gezählt werden Zeitpunkte, nicht Zeilen.
      Beim Redeploy verdoppeln sich Rohzeilen, Poll-Zeitpunkte nicht — und zwei
      Container, die wirklich getrennt pollen, sind zwei Polls und werden auch als zwei
      gezählt.
    columns:
      - name: quelle
        tests:
          - not_null
      - name: fetched_at
        tests:
          - not_null
      - name: feed_alter_sek
        description: >
          `fetched_at − snapshot_ts`. Gemessen rund 19 s; steigt der Wert, liefert die
          Quelle veraltete Daten, ohne dass ein Poll fehlt.
      - name: abstand_sek
        description: >
          Sekunden seit dem vorigen Poll. NULL beim allerersten — davor gab es nichts,
          und 0 wäre gelogen.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['quelle', 'fetched_at']

  - name: int_de_soll_laufweg
    description: >
      Hält den beobachteten Laufweg gegen den planmäßigen — nur für Fahrten, in denen
      **kein einziger** Halt bedient wurde (BPULS-064).

      Diese Fahrten sind in den deutschen Daten die Form, in der ein vollständiger
      Ausfall ankommt: der Feed setzt `trip.schedule_relationship = CANCELED` nie,
      sondern streicht die Halte einzeln. Ohne diesen Abgleich ließe sich ein solcher
      Lauf nicht von einer Fahrt unterscheiden, die erst ab der Mitte beobachtet wurde
      und deren Rest gestrichen war — beide sehen in den Ist-Daten gleich aus.

      Version und Feed kommen aus dem Makro `gueltige_fahrplanversion` (Regel 9),
      gemeinsam mit `int_de_ausfaelle`. Fahrten ohne eindeutige Zuordnung erscheinen
      hier mit `laufweg_pruefbar = false` und `laufweg_vollstaendig = NULL` — seit
      BPULS-066 mit einer Zeile, vorher gar nicht. Sie nachgelagert als „nicht belegt"
      zu lesen war falsch: an den Daten traf das ausschließlich Fahrten ohne
      Liniennummer (0 von 182 belegt über drei Betriebstage, gegen 97,6 bis 100 % bei
      Fahrten mit Linie), weil Linienname und Soll-Laufweg aus derselben Quelle
      stammen. Eine Aussage über die Reichweite der Methode sah damit aus wie eine
      über den Betrieb.
    columns:
      - name: betriebstag
        tests:
          - not_null
      - name: trip_key
        tests:
          - not_null
          - unique
      - name: static_version
        description: >
          Die zum Betriebstag gültige Version, nie die neueste (Regel 9). NULL, wo
          keine Version die `trip_id` kennt — dort ist auch `laufweg_pruefbar` false.
      - name: feed
      - name: beobachtete_halte
        description: Anzahl der Halte, die überhaupt gemeldet wurden.
        tests:
          - not_null
      - name: soll_halte
        description: >
          Anzahl der Halte, die der gültige Fahrplan für diese Fahrt vorsieht — 0, wenn
          es keinen gibt.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: soll_halte_beobachtet
        description: >
          Wie viele der Soll-Halte in den Ist-Daten vorkommen. Gezählt wird die
          **Deckung**, nicht ein Vergleich zweier Anzahlen: zwei gleich große, aber
          verschiedene Mengen wären sonst „vollständig".
        tests:
          - not_null
      - name: laufweg_pruefbar
        description: >
          Ob überhaupt ein Soll-Laufweg dagegensteht. Ist er es nicht, sagt das nichts
          über die Fahrt, sondern etwas über die Reichweite der Methode.
        tests:
          - not_null
      - name: laufweg_vollstaendig
        description: >
          `soll_halte_beobachtet = soll_halte`. Nur hier ist ausgeschlossen, dass bloß
          das gestrichene Ende einer sonst gefahrenen Fahrt beobachtet wurde. **NULL**,
          wo nichts zu prüfen war — nicht false: das wäre eine Behauptung über eine
          Fahrt, über die nichts vorliegt.

  - name: int_de_ausfaelle
    description: >
      Löst vollständige Ausfälle in Halt-Ereignisse auf (BPULS-032, A5). Ein
      ausgefallener Zug meldet sich ohne `stop_time_update`; ohne den Soll-Laufweg
      aus dem statischen Fahrplan gäbe es keinen Halt, an dem der Ausfall hängen
      könnte — am Produktionsstand vom 2026-08-21 erreichte deshalb **kein
      einziger** Ausfall die Kennzahlen.

      Gejoint wird gegen die **zum Betriebstag gültige** Fahrplan-Version, nie gegen
      die neueste und nie über alle vereinigt (Regel 9). Fahrten, deren `trip_id` in
      derselben Version in beiden Feeds steht, bleiben unaufgelöst statt geraten;
      `assert_de_ausfaelle_aufgeloest` meldet alle nicht aufgelösten Fälle als
      Warnung.
    columns:
      - name: betriebstag
        tests:
          - not_null
      - name: trip_key
        tests:
          - not_null
      - name: stop_sequence
        tests:
          - not_null
      - name: zug_ausgefallen
        description: Immer wahr — dieses Modell erzeugt ausschließlich Ausfallzeilen.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true]
                quote: false
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['trip_key', 'stop_sequence']
