name: 'bahnpuls'
version: '1.0.0'
config-version: 2

profile: 'bahnpuls'

model-paths: ["models"]
test-paths: ["tests"]
# ../config, nicht eine Kopie unter seeds/: die Gebietsliste ist **dieselbe Datei**,
# die der Collector filtert (config/scope_stops.csv, BPULS-074/075). Zwei
# Formulierungen desselben Gebiets laufen auseinander, und dann zeigen Collector und
# Dashboard verschiedene Gebiete, ohne dass ein Test anschlaegt.
seed-paths: ["seeds", "../config"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Pfad/Glob zu den rohen GTFS-RT-Momentaufnahmen des Collectors. Produktiv zeigt er
  # auf das Persistent Volume (/data/raw), lokal auf das Entwicklungsverzeichnis.
  de_gtfsrt_glob: "../data/raw/**/*.parquet"
  # Karenz fuer die Ist-Bestimmung aus GTFS-RT: als Ist gilt der letzte Wert, der bis
  # Soll + diese Spanne gemeldet wurde. Annahme, siehe Methodik-Seite (BPULS-030).
  de_ist_karenz_minuten: 5
  # Verzeichnis der versionierten statischen Fahrplaene (BPULS-023). Produktiv das
  # Persistent Volume, lokal das Entwicklungsverzeichnis.
  de_static_dir: "../data/static"
  # Poll-Intervall des Collectors in Sekunden (ADR-011: bleibt bei 30). Nur die
  # Erwartung fuer die Poll-Abdeckung haengt daran -- der Collector liest es nicht von
  # hier, er hat sein eigenes Flag. Wird das Intervall geaendert, muss dieser Wert
  # mitgezogen werden, sonst rechnet mart_erhebung gegen eine falsche Erwartung.
  de_poll_intervall_sek: 30

seeds:
  bahnpuls:
    erhebungsluecken:
      +column_types:
        # Explizit date: die Spalten sind die Grenzen eines Betriebstagsbereichs und
        # werden gegen `betriebstag` gejoint. Als varchar abgeleitet verglichen sie
        # lautlos Zeichenketten -- richtig fuer ISO-Daten, falsch, sobald jemand ein
        # anderes Format eintraegt.
        betriebstag_von: date
        betriebstag_bis: date
        grund: varchar
        referenz: varchar
    scope_stops:
      +column_types:
        # varchar, nicht der abgeleitete BIGINT: im Feed ist die stop_id eine
        # Zeichenkette, und ein Join varchar gegen bigint scheitert lautlos an der
        # Typkonversion statt am Wert.
        stop_id: varchar
        stop_name: varchar
        stop_lat: double
        stop_lon: double

models:
  bahnpuls:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      # Ab dem ersten Mart inkrementell, nicht erst wenn es weh tut (BPULS-016,
      # CLAUDE.md Regel 10): ein naechtlicher Vollaufbau waechst linear mit der
      # Historie. delete+insert ersetzt ganze Betriebstags-Partitionen.
      +materialized: incremental
      +incremental_strategy: delete+insert
