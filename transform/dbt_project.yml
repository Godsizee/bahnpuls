name: 'bahnpuls'
version: '1.0.0'
config-version: 2

profile: 'bahnpuls'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Pfad/Glob zu den rohen CH-Ist-Daten-CSVs, siehe Bahnpuls_Datenquellen.md.
  # Relativ zu transform/, wo dbt ausgefuehrt wird.
  ch_istdaten_glob: "../data/ch/*_istdaten.csv"
  # Pfad/Glob zu den rohen GTFS-RT-Momentaufnahmen des Collectors. Produktiv zeigt er
  # auf das Persistent Volume (/data/raw), lokal auf das Entwicklungsverzeichnis.
  de_gtfsrt_glob: "../data/raw/**/*.parquet"
  # Karenz fuer die Ist-Bestimmung aus GTFS-RT: als Ist gilt der letzte Wert, der bis
  # Soll + diese Spanne gemeldet wurde. Annahme, siehe Methodik-Seite (BPULS-030).
  de_ist_karenz_minuten: 5
  # Verzeichnis der versionierten statischen Fahrplaene (BPULS-023). Produktiv das
  # Persistent Volume, lokal das Entwicklungsverzeichnis.
  de_static_dir: "../data/static"

models:
  bahnpuls:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      # Ab dem ersten Mart inkrementell, nicht erst wenn es weh tut (BPULS-016,
      # CLAUDE.md Regel 10): ein naechtlicher Vollaufbau waechst linear mit der
      # Historie. delete+insert ersetzt ganze Betriebstags-Partitionen.
      +materialized: incremental
      +incremental_strategy: delete+insert
